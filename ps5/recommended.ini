# Crux2 recommended settings 1
#
# Settings tested on a PS5, per game. Crux2 downloads this file from the repository's main
# branch at most once a day (ps5/frontend/ps5_recommend.cpp) and keeps it in its data folder as
# recommended.ini. A game that has an entry shows "Recommended settings" at the top of its own
# options (Triangle in the library > the game's options), with each setting it changes; one press
# applies them as that game's own settings, which can be changed or taken away again as usual.
#
# The first line above has to stay as it is: a file without it is not used.
#
# A section is a game's serial, as the library shows it (SLUS-20312, SCES-50000). Its lines:
#   note = one line on why, shown to the player
#   <Section>/<Key> = <value>   a setting as a game's settings file (gamesettings/*.ini) has it:
#                               the part before the last '/' is the file's section, the rest the
#                               key. Only PCSX2's emulation settings are taken (the sections
#                               EmuCore, EmuCore/... and Framerate); anything else is left out.
#
# Example (not a real recommendation):
#   [SLUS-00000]
#   note = Steady at 3x; the half-pixel offset fixes the blurred menus.
#   EmuCore/GS/upscale_multiplier = 3
#   EmuCore/GS/UserHacks_HalfPixelOffset = 1
#
# There are no tested entries yet.
