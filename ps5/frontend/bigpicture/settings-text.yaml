      - heading: "rendering"
        label: "RENDERING"
        rows:
          - id: "EmuCore/GS.upscale_multiplier@graphics/rendering"
            label: "Internal resolution"
            desc: "Multiplies the render resolution by the specified factor (upscaling)."
            choices: ["Native (PS2)", "2x (~720p)", "3x (~1080p)", "4x (~1440p)", "5x (~1800p)", "6x (~2160p, 4K)", "7x", "8x (~2880p)", "9x", "10x", "11x", "12x"]
            kind: "floatlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Internal Resolution"
            pcsx2_description: "Multiplies the render resolution by the specified factor (upscaling)."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3163"
          - id: "EmuCore/GS.CASMode"
            label: "Upscaling and sharpening"
            desc: "Off uses the internal resolution as it is. FSR 1 renders the game at a lower resolution and upscales it with AMD FidelityFX Super Resolution; CAS sharpens the image with FidelityFX Contrast Adaptive Sharpening."
            choices: ["Off", "FSR 1 from 4x (sharpest)", "FSR 1 from 3x", "FSR 1 from 2x (fastest)", "NIS: enlarge and sharpen", "CAS: sharpen", "CAS: sharpen and resize"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Contrast Adaptive Sharpening"
            pcsx2_description: "Enables FidelityFX Contrast Adaptive Sharpening."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3418"
          - id: "EmuCore/GS.CASSharpness"
            label: "Sharpness"
            desc: "Determines the intensity the sharpening effect in CAS post-processing."
            kind: "intrange"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Sharpness"
            pcsx2_description: "Determines the intensity the sharpening effect in CAS post-processing."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3420"
          - id: "EmuCore/GS.filter"
            label: "Texture filtering"
            desc: "Selects where bilinear filtering is utilized when rendering textures."
            choices: ["Nearest (blocky)", "Bilinear (always)", "Bilinear (as the PS2)", "Bilinear (always, not sprites)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Texture Filtering"
            pcsx2_description: "Selects where bilinear filtering is utilized when rendering textures."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3166"
            pcsx2_tooltip: "Changes what filtering algorithm is used to map textures to surfaces.<br> Nearest: Makes no attempt to blend colors.<br> Bilinear (Forced): Will blend colors together to remove harsh edges between different colored pixels even if the game told the PS2 not to.<br> Bilinear (PS2): Will apply filtering to all surfaces that a game instructs the PS2 to filter.<br> Bilinear (Forced Excluding Sprites): Will apply filtering to all surfaces, even if the game told the PS2 not to, except sprites."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:514"
          - id: "EmuCore/GS.TriFilter"
            label: "Trilinear filtering"
            desc: "Selects where trilinear filtering is utilized when rendering textures."
            choices: ["Automatic", "Off", "As the PS2", "Always"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Trilinear Filtering"
            pcsx2_description: "Selects where trilinear filtering is utilized when rendering textures."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3169"
            pcsx2_tooltip: "Reduces blurriness of large textures applied to small, steeply angled surfaces by sampling colors from the two nearest Mipmaps. Requires Mipmapping to be 'on'.<br> Off: Disables the feature.<br> Trilinear (PS2): Applies Trilinear filtering to all surfaces that a game instructs the PS2 to.<br> Trilinear (Forced): Applies Trilinear filtering to all surfaces, even if the game told the PS2 not to."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:522"
          - id: "EmuCore/GS.MaxAnisotropy"
            label: "Anisotropic filtering"
            desc: "Reduces texture aliasing at extreme viewing angles."
            choices: ["Off", "2x", "4x", "8x", "16x"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Anisotropic Filtering"
            pcsx2_description: "Reduces texture aliasing at extreme viewing angles."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3172"
          - id: "EmuCore/GS.dithering_ps2"
            label: "Dithering"
            desc: "Selects the type of dithering applies when the game requests it."
            choices: ["Off", "Scaled", "Unscaled (as the PS2)", "Force 32 bit"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Dithering"
            pcsx2_description: "Selects the type of dithering applies when the game requests it."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3175"
            pcsx2_tooltip: "Reduces banding between colors and improves the perceived color depth.<br> Off: Disables any dithering.<br> Scaled: Upscaling-aware / Highest dithering effect.<br> Unscaled: Native dithering / Lowest dithering effect, does not increase size of squares when upscaling.<br> Force 32bit: Treats all draws as if they were 32bit to avoid banding and dithering."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:531"
          - id: "EmuCore/GS.accurate_blending_unit"
            label: "Blending accuracy"
            desc: "Determines the level of accuracy when emulating blend modes not supported by the host graphics API."
            choices: ["Minimum", "Basic", "Medium", "High", "Full (slow)", "Maximum (very slow)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Blending Accuracy"
            pcsx2_description: "Determines the level of accuracy when emulating blend modes not supported by the host graphics API."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3177"
            pcsx2_tooltip: "Control the accuracy level of the GS blending unit emulation.<br> The higher the setting, the more blending is emulated in the shader accurately, and the higher the speed penalty will be."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:538"
          - id: "EmuCore/GS.hw_mipmap"
            label: "Mipmapping"
            desc: "Enables mipmapping, which some games require to render correctly. Mipmapping uses progressively lower resolution variants of textures at progressively further distances to reduce processing load and avoid visual artifacts."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Mipmapping"
            pcsx2_description: "Enables mipmapping, which some games require to render correctly. Mipmapping uses progressively lower resolution variants of textures at progressively further distances to reduce processing load and avoid visual artifacts."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3185"
          - id: "EmuCore/GS.HWAccurateAlphaTest"
            label: "Accurate alpha test"
            desc: "Enables accurate alpha testing, which some games require to render correctly. This may require more draw calls and result in a speed penalty."
