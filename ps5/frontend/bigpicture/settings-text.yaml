            label: "Upscaling and Sharpening"
            desc: "Selects how the image is upscaled and sharpened. FSR 1 renders at a lower resolution and upscales with AMD FidelityFX Super Resolution; NIS upscales and sharpens with NVIDIA Image Scaling; Sharpen uses FidelityFX Contrast Adaptive Sharpening."
            choices: ["Off", "FSR 1 from 4x (Sharpest) (Default)", "FSR 1 from 3x", "FSR 1 from 2x (Fastest)", "NIS (Upscale and Sharpen)", "Sharpen Only (Internal Resolution)", "Sharpen and Resize (Display Resolution)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Contrast Adaptive Sharpening"
            pcsx2_description: "Enables FidelityFX Contrast Adaptive Sharpening."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3424"
            label_text: "written"
            text: "written"
            text_note: "PCSX2's text was untrue of this row; written in PCSX2's style instead (the owner's decision of 2026-11-15)"
            choices_text: "mixed"
