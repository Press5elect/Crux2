          - id: EmuCore/TraceLog.EE.mskpath3
            label: "EE: MSKPATH3"
          - id: EmuCore/TraceLog.EE.r5900
            label: "EE: R5900"
          - id: EmuCore/TraceLog.EE.cop0
            label: "EE: COP0"
          - id: EmuCore/TraceLog.EE.cop1
            label: "EE: COP1 (FPU)"
          - id: EmuCore/TraceLog.EE.cop2
            label: "EE: COP2 (VU0 macro)"
          - id: EmuCore/TraceLog.EE.cache
            label: "EE: cache"
          - id: EmuCore/TraceLog.EE.knownhw
            label: "EE: HW registers (MMIO)"
          - id: EmuCore/TraceLog.EE.unknownhw
            label: "EE: unknown MMIO"
          - id: EmuCore/TraceLog.EE.dmahw
            label: "EE: DMA registers"
          - id: EmuCore/TraceLog.EE.ipu
            label: "EE: IPU"
          - id: EmuCore/TraceLog.EE.dmac
            label: "EE: DMA control"
          - id: EmuCore/TraceLog.EE.counters
            label: "EE: counters"
          - id: EmuCore/TraceLog.EE.spr
            label: "EE: SPR / MFIFO"
          - id: EmuCore/TraceLog.EE.vif
            label: "EE: VIF"
          - id: EmuCore/TraceLog.EE.gif
            label: "EE: GIF"
          - id: EmuCore/TraceLog.MISC.sif
            label: SIF
          - id: EmuCore/TraceLog.IOP.bios
            label: "IOP: BIOS"
          - id: EmuCore/TraceLog.IOP.memcards
            label: "IOP: memory cards"
          - id: EmuCore/TraceLog.IOP.pad
            label: "IOP: pad"
          - id: EmuCore/TraceLog.IOP.r3000a
            label: "IOP: R3000A"
          - id: EmuCore/TraceLog.IOP.cop2
            label: "IOP: COP2 (GPU)"
          - id: EmuCore/TraceLog.IOP.memory
            label: "IOP: memory"
          - id: EmuCore/TraceLog.IOP.knownhw
            label: "IOP: HW registers (MMIO)"
          - id: EmuCore/TraceLog.IOP.unknownhw
            label: "IOP: unknown MMIO"
          - id: EmuCore/TraceLog.IOP.dmahw
            label: "IOP: DMA registers"
          - id: EmuCore/TraceLog.IOP.dmac
            label: "IOP: DMA control"
          - id: EmuCore/TraceLog.IOP.counters
            label: "IOP: counters"
          - id: EmuCore/TraceLog.IOP.cdvd
            label: "IOP: CDVD"
          - id: EmuCore/TraceLog.IOP.mdec
            label: "IOP: MDEC"
      - heading: graphics-debugging
        label: GRAPHICS DEBUGGING
        rows:
          - id: EmuCore/GS.UseDebugBlend
            label: Use debug blend
            desc: Forces SW blending and disables several optimizations.
          - id: PS5.GsDumpSeconds
            label: GS dump length
            desc: "How long \"Record a GS dump\" in the quick menu records. A heavy scene gives several hundred MB a second, even compressed."
            kind: intlist
            choices: ["1 second", "2 seconds", "5 seconds"]
          - id: EmuCore/GS.GSDumpCompression
            label: GS dump compression
            desc: Change the compression algorithm used when creating a GS dump.
            kind: intlist
            choices: [Uncompressed, LZMA (xz), Zstandard (zst)]
          - id: EmuCore/GS.DumpGSData
            label: Dump GS draws
            desc: Dumps information about every draw to the snapshots folder. Very slow and very large.
          - id: EmuCore/GS.SaveRT
            label: Save render target
          - id: EmuCore/GS.SaveFrame
            label: Save frame
          - id: EmuCore/GS.SaveTexture
            label: Save texture
          - id: EmuCore/GS.SaveDepth
            label: Save depth
          - id: EmuCore/GS.SaveAlpha
            label: Save alpha
          - id: EmuCore/GS.SaveInfo
            label: Save info
          - id: EmuCore/GS.SaveTransferImages
            label: Save transfer image data
          - id: EmuCore/GS.SaveDrawStats
            label: Save draw stats
          - id: EmuCore/GS.SaveFrameStats
            label: Save frame stats
          - id: EmuCore/GS.SaveHWConfig
            label: Save HW config
          - id: EmuCore/GS.SaveDrawStart
            label: Save draw start
            kind: intrange
          - id: EmuCore/GS.SaveDrawCount
            label: Save draw count
            kind: intrange
          - id: EmuCore/GS.SaveFrameStart
            label: Save frame start
            kind: intrange
          - id: EmuCore/GS.SaveFrameCount
            label: Save frame count
            desc: -1 saves every frame.
            kind: intrange
      - heading: what-is-logged-and-where
        label: "WHAT IS LOGGED, AND WHERE"
        rows:
          - id: PS5.Logs
            label: Logs
            desc: "Off: no logs at all, from the next start: no crux2-boot.log, no emulog.txt, no copy in the console's kernel log, the graphics driver's messages dropped. A problem can then not be looked into; turn them on again to report one."
          - id: "action:logs-go-to"
            label: Logs go to
            desc: "The console's own drive (the title folder), or a USB drive's Crux2-logs folder, which spares the console's drive the writes. A drive that is out at the start: the boot log is kept in memory for that session. From the next start."
            kind: action
          - id: PS5.LogBoot
            label: "Crux2's boot log"
            desc: "crux2-boot.log: the start, each game, its speed and pacing, and what went wrong (and a crash report). The file to send with a report. From the next start."
          - id: PS5.LogDriver
            label: "The graphics driver's messages"
            desc: "What the graphics driver prints, in the boot log: needed for a report of a graphics fault. From the next start."
          - id: Logging.EnableFileLogging
            label: "The emulator's own log"
            desc: "emulog.txt: PCSX2's own messages about the game (its disc, memory cards, the game's own debug output)."
          - id: PS5.LogKlog
            label: "A copy in the console's kernel log"
            desc: "Each line of the boot log also to klog, for a computer that reads the console's log as it runs. Nothing is written to a drive for it. From the next start."
  - page: ps5
    name: PlayStation 5
    headings:
      - heading: ps5-tuning
        label: PS5 TUNING
        rows:
          - id: PS5.ThreadPriorities
            label: Sound and controls before the emulator
            desc: "Gives sound, controllers and menus priority over the emulator, and runs downloads and copies after it. Prevents crackling and late button presses."
          - id: PS5.FastPipelines
            label: Build shaders quickly first
            desc: "Draws new effects with a quickly built shader first, then switches to the optimised one. Reduces stutter the first time an effect appears."
      - heading: native-code-modules-experimental
        label: NATIVE CODE MODULES (EXPERIMENTAL)
        rows:
          - id: PS5.NativeModules
            label: Use native code modules
            desc: "Runs a game's code from a native module built with the recomp kit from your own copy of the game. Experimental."
          - id: PS5.NativeExport
            label: Put executables on the share
            desc: "Copies a game's executable to the network share when no module exists, so the recomp kit can build one."
          - id: PS5.NativeHardware
            label: Native code may use hardware
            desc: "Lets native modules access the console's hardware directly. Turn off if a game hangs with its module."
          - id: PS5.NativeCheck
            label: Check native code
            desc: "Runs every function twice and compares the result with PCSX2's interpreter. Very slow; for finding bugs only."
      - heading: about
        label: ABOUT
        rows:
          - id: "ps5/info:crux2"
            label: Crux2
            kind: info
            dynamic: true
          - id: "ps5/info:emulator"
            label: Emulator
            kind: info
            dynamic: true
          - id: "action:quit-pcsx2"
            label: Quit PCSX2
            desc: Closes the title
            kind: action
      - heading: updates
        label: UPDATES
        rows:
          - id: "action:look-for-a-newer-crux2"
            label: Look for a newer Crux2
            desc: Checks GitHub for a newer version. Nothing is downloaded without asking.
            kind: action
          - id: PS5.UpdateAtStart
            label: Look for a newer Crux2 at start-up
            desc: Checks GitHub for a newer version each time Crux2 starts. Nothing is downloaded without asking.
          - id: "action:what-s-new"
            label: "What's new"
            desc: "What was added, changed and fixed in each version, newest first."
            kind: action
          - id: "action:install-this-version-again"
            label: Install this version again
            desc: "Reinstalls the newest version to repair missing or broken files. Your settings, saves and games are kept."
            kind: action
      - heading: the-console
        label: THE CONSOLE
        rows:
          - id: PS5.ThreadedRecording
            label: Graphics driver on its own thread
            desc: Runs the graphics driver on its own CPU thread. Usually faster in demanding games.
          - id: PS5.GpuWaitSpinUs
            label: "Wait for the GPU: checking for"
            desc: How long the driver keeps checking whether the GPU is done before it starts sleeping between checks.
            kind: intrange
          - id: PS5.GpuWaitSleepUs
            label: "Wait for the GPU: sleeps of"
            desc: How long the driver sleeps between checks while waiting for the GPU.
            kind: intrange
          - id: "action:profile-the-next-start"
            label: Profile the next start
            desc: Records detailed performance data on the next start and writes it to crux2-boot.log. Useful for finding out why a game is slow.
            kind: action
