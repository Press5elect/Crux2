            text: "written"
            new_choices: ["Linear (Default)", "Gentle", "Gentler", "Gentlest"]
            choices_text: "written"
          - id: "PS5.MotionAim"
            label: "Aim with motion"
            desc: "Aims the GunCon 2 light gun by moving the controller (always, while a GunCon 2 is plugged in). Hold R3 a moment to recentre; hold it for two seconds to measure the screen."
            kind: "toggle"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Motion Aiming"
            label_text: "written"
            new_desc: "Aims the GunCon 2 light gun by moving the controller while a GunCon 2 is connected. Hold R3 briefly to recenter; hold it for two seconds to calibrate the screen."
            text: "written"
          - id: "PS5.MotionAimMode"
            label: "Aim"
            desc: "Steady: where the controller points is where the gun aims, and it does not drift away. Like a mouse: the aim of before, which adds up the controller's turns and stops at the edges."
            choices: ["Steady (new)", "Like a mouse (before)"]
            kind: "stringlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Aiming Mode"
            label_text: "written"
            new_desc: "Selects how motion aiming follows the controller. Absolute aims where the controller points, without drift. Relative adds up the controller's turns like a mouse and stops at the edges."
            text: "written"
            new_choices: ["Absolute (Default)", "Relative"]
            choices_text: "written"
          - id: "PS5.MotionAimSpeed"
            label: "Aim speed"
            desc: "How far you turn the controller to aim at the edge of the screen (steady aim). Your screen: as measured by pointing at its corners."
            choices: ["Your screen (measured)", "1 (slowest)", "2", "3", "4", "5", "6", "7", "8", "9", "10 (fastest)"]
            kind: "intlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Aiming Range"
            label_text: "written"
            new_desc: "Determines how far the controller must turn to aim at the edge of the screen with absolute aiming. Calibrated uses the screen as measured by pointing at its corners."
            text: "written"
            new_choices: ["Calibrated", "1 (Slowest)", "2", "3", "4", "5 (Default)", "6", "7", "8", "9", "10 (Fastest)"]
            choices_text: "written"
          - id: "action:measure-the-screen"
            label: "Measure the screen"
            desc: "Back in the game, point at the screen's top-left corner and press R3, then at its bottom-right corner and press R3. Holding R3 for two seconds in a game does the same."
            kind: "action"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Calibrate Screen"
