          - id: "EmuCore/GS.FrameGeneration"
            label: "Frame generation"
            desc: "Generates extra frames between the game's own, so a 30 fps game is shown at 60 fps. Adds a little input lag and can cause smearing on fast movement."
            choices: ["Off", "30 to 60", "30 to 60, and 60 to 120 at 120 Hz"]
            kind: "intlist"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            new_label: "Frame Generation"
            label_text: "written"
            new_desc: "Generates extra frames between the game's frames, so a 30 FPS game is shown at 60 FPS. Increases input lag slightly and can cause smearing on fast movement."
            text: "written"
            new_choices: ["Off (Default)", "30 to 60 FPS", "30 to 60 FPS, 60 to 120 FPS at 120 Hz"]
            choices_text: "written"
          - id: "EmuCore/GS.FrameGenerationMethod"
            label: "Frame generation method"
            desc: "How the extra frames are made. Crux2's own: its motion search. AMD FSR 3 optical flow: handles small, fast movement better, and keeps a score or a map still. MihawkGen: Mihawk's small trained network, which looks at the two pictures only and leaves what did not move exactly as it was."
            choices: ["Crux2's own", "AMD FSR 3 optical flow", "MihawkGen"]
            kind: "intlist"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            new_label: "Frame Generation Method"
            label_text: "written"
            new_desc: "Selects how the extra frames are made. Default uses a motion search; AMD FSR 3 Optical Flow handles small, fast movement better and keeps static elements such as a score or a map still; MihawkGen uses a small trained network that looks only at the two frames and leaves unmoving parts as they were."
            text: "written"
            new_choices: ["Default", "AMD FSR 3 Optical Flow", "MihawkGen"]
            choices_text: "written"
          - id: "EmuCore/GS.FrameGenerationQuality"
            label: "Optical flow quality"
            desc: "Higher quality needs more GPU power."
            choices: ["Performance", "Balanced", "Quality"]
            kind: "intlist"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            new_label: "Optical Flow Quality"
            label_text: "written"
            new_desc: "Determines the quality of the AMD FSR 3 optical flow. Higher quality reduces performance."
            text: "written"
            new_choices: ["Performance", "Balanced (Default)", "Quality"]
            choices_text: "written"
          - id: "EmuCore/GS.FrameGenerationSkipVideos"
            label: "No frame generation during videos"
            desc: "Turns frame generation off while the game plays a video."
            kind: "toggle"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            new_label: "Disable Frame Generation During FMVs"
            label_text: "written"
            new_desc: "Disables frame generation while the game plays an FMV."
            text: "written"
          - id: "EmuCore/GS.FrameGenerationSteady30"
            label: "Steady 30"
            desc: "Takes the game's pictures two vsyncs apart at the most, so a game that goes between 30 and 60 a second is shown at an even 30 that frame generation makes 60 (120 at 120 Hz). For games that cannot hold 60."
            kind: "toggle"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            new_label: "Steady 30 FPS"
            label_text: "written"
            new_desc: "Limits the game's frames to every second vsync, so a game that varies between 30 and 60 FPS is shown at an even 30 FPS that frame generation doubles to 60 FPS (120 FPS at 120 Hz). For games that cannot hold 60 FPS."
            text: "written"
          - id: "EmuCore/GS.PS5FrameGenDebug"
            label: "Show the movement"
            desc: "For checking frame generation, not for playing: the made frames show what AMD FSR 3 optical flow decided for each pixel instead of the picture (red both frames, green the newer alone, blue the older alone, grey the two mixed). Takes effect the next time a game starts."
            kind: "toggle"
            area: "Picture"
            section: "Frame generation"
            level: "More"
            origin: "crux2"
            new_label: "Show Frame Generation Motion"
            label_text: "written"
            new_desc: "Shows, in the generated frames, what AMD FSR 3 optical flow decided for each pixel instead of the picture: red for both frames, green for the newer only, blue for the older only, gray for a mix. For debugging only."
            text: "written"
