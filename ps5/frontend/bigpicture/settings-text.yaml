            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5SkipRedundantBarriers"
            label: "Skip Redundant Barriers"
            desc: "Skips GPU waits when nothing has been drawn since the last one. Disable it if effects look wrong."
