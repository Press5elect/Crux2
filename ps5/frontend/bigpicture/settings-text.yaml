  - page: "bios"
    name: "BIOS"
    headings:
      - heading: "the-playstation-2-s-own-menu"
        label: "THE PLAYSTATION 2'S OWN MENU"
        rows:
          - id: "action:start-the-playstation-2-menu"
            label: "Start the PlayStation 2 menu"
            desc: "Starts the PS2 BIOS without a game, to use the memory card browser and System Configuration."
            kind: "action"
            area: "Games and saves"
            section: "BIOS"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
      - heading: "bios-selection"
        label: "BIOS SELECTION"
        rows:
          - id: "Filenames.BIOS"
            label: "BIOS"
            desc: "The PS2 BIOS, which every game needs. Use a dump from your own console."
            choices: ["The first one found"]
            kind: "stringlist"
            area: "Games and saves"
            section: "BIOS"
            level: "Essentials"
            origin: "pcsx2"
          - id: "info:none-of-your-own-found"
            label: "None of your own found"
            desc: ""
