            pcsx2_tooltip: "Changes how PCSX2 handles rounding while emulating the Emotion Engine's Vector Unit 0 (EE VU0). The default value handles the vast majority of games; <b>modifying this setting when a game is not having a visible problem will cause stability issues and/or crashes.</b>"
            pcsx2_tooltip_source: "pcsx2-qt/Settings/AdvancedSettingsWidget.cpp:103"
          - id: "EmuCore/CPU/Recompiler.vu0Overflow"
