      - heading: "post-processing"
        label: "POST-PROCESSING"
        rows:
          - id: "PS5.AntiAliasing"
            label: "Anti-aliasing"
            desc: "Smooths the jagged edges of the picture. FXAA: quick, a little soft. SMAA: sharper edges, a little GPU time. SSAA: the game drawn larger than the screen and made screen-sized, the least shimmer; choosing it raises the internal resolution to about one and a half times the screen's (8x at 4K) and turns FSR 1 off, and costs the most. SSAA + SMAA: SSAA, then SMAA over it for the edges it leaves."
            choices: ["Off", "FXAA", "SMAA", "SSAA", "SSAA + SMAA"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
          - id: "PS5.SSAAFilter"
            label: "SSAA filter"
            desc: "How SSAA makes the larger picture screen-sized. Soft: every pixel it covers averaged, the least shimmer. Sharp: a Lanczos filter, crisper edges."
            choices: ["Soft", "Sharp"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
          - id: "EmuCore/GS.TVShader"
            label: "TV shader"
            desc: "Applies a shader which replicates the visual effects of different styles of television sets."
            choices: ["None", "Scanlines", "Diagonal", "Triangular", "Wave", "Lottes CRT", "4xRGSS", "NxAGSS"]
            kind: "intlist"
            area: "Picture"
            section: "Looks"
            level: "More"
            origin: "pcsx2"
