  - page: "playstation-5"
    name: "PlayStation 5"
    headings:
      - heading: "ps5-tuning"
        label: "PS5 TUNING"
        rows:
          - id: "PS5.ThreadPriorities"
            label: "Sound and controls before the emulator"
            desc: "Gives sound, controllers and menus priority over the emulator, and runs downloads and copies after it. Prevents crackling and late button presses."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            new_label: "Prioritize Audio and Input"
            label_text: "written"
            new_desc: "Gives sound, controllers and menus priority over the emulator, and runs downloads and copies after it. Prevents crackling and late button presses."
            text: "written"
          - id: "PS5.FastPipelines"
            label: "Build shaders quickly first"
            desc: "Draws new effects with a quickly built shader first, then switches to the optimised one. Reduces stutter the first time an effect appears."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            new_label: "Fast Shader Compilation"
            label_text: "written"
            new_desc: "Draws new effects with a quickly built shader first, then switches to the optimized one. Reduces stutter the first time an effect appears."
            text: "written"
      - heading: "native-code-modules-experimental"
        label: "NATIVE CODE MODULES (EXPERIMENTAL)"
        rows:
          - id: "PS5.NativeModules"
            label: "Use native code modules"
            desc: "Runs a game's code from a native module built with the recomp kit from your own copy of the game. Experimental."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            doubtful: "how games' code runs: or Emulation > Advanced?"
            new_label: "Use Native Code Modules"
            label_text: "written"
            new_desc: "Runs a game's code from a native module built with the recomp kit from your copy of the game. May cause issues in some games."
            text: "written"
          - id: "PS5.NativeExport"
            label: "Put executables on the share"
            desc: "Copies a game's executable to the network share when no module exists, so the recomp kit can build one."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            doubtful: "how games' code runs: or Emulation > Advanced?"
            new_label: "Export Executables"
            label_text: "written"
            new_desc: "Copies a game's executable to the network share when no module exists, so the recomp kit can build one."
            text: "written"
          - id: "PS5.NativeHardware"
            label: "Native code may use hardware"
            desc: "Lets native modules access the console's hardware directly. Turn off if a game hangs with its module."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            doubtful: "how games' code runs: or Emulation > Advanced?"
            new_label: "Allow Hardware Access"
            label_text: "written"
            new_desc: "Allows native modules to access the console's hardware directly. Disable it if a game hangs with its module."
            text: "written"
          - id: "PS5.NativeCheck"
            label: "Check native code"
            desc: "Runs every function twice and compares the result with PCSX2's interpreter. Very slow; for finding bugs only."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            doubtful: "how games' code runs: or Emulation > Advanced?"
            new_label: "Verify Native Code"
            label_text: "written"
            new_desc: "Runs every function twice and compares the result with PCSX2's interpreter. Greatly reduces performance; for debugging only."
            text: "written"
      - heading: "updates"
        label: "UPDATES"
        rows:
          - id: "action:look-for-a-newer-crux2"
            label: "Look for a newer Crux2"
            desc: "Checks GitHub for a newer version. Nothing is downloaded without asking."
            kind: "action"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Check for Updates"
            label_text: "written"
            new_desc: "Checks GitHub for a newer version. Nothing is downloaded without asking."
            text: "written"
          - id: "PS5.UpdateAtStart"
            label: "Look for a newer Crux2 at start-up"
            desc: "Checks GitHub for a newer version each time Crux2 starts. Nothing is downloaded without asking."
            kind: "toggle"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Check for Updates on Startup"
            label_text: "written"
            new_desc: "Checks GitHub for a newer version on startup. Nothing is downloaded without asking."
            text: "written"
          - id: "PS5.FixesAtStart"
            label: "Game fixes from GitHub at start"
            desc: "Each time Crux2 starts, fetches the game fixes that changed since this version was made (game database entries and game patches). They apply to the games started after they came."
            kind: "toggle"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Update Game Fixes on Startup"
            label_text: "written"
            new_desc: "Downloads, on startup, the game fixes (game database entries and game patches) changed since this version was built. They apply to games started afterwards."
            text: "written"
          - id: "action:what-s-new"
            label: "What's new"
            desc: "What was added, changed and fixed in each version, newest first."
            kind: "action"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "What's New"
            label_text: "written"
            new_desc: "Shows what was added, changed and fixed in each version, newest first."
            text: "written"
          - id: "action:install-this-version-again"
            label: "Install this version again"
            desc: "Reinstalls the newest version to repair missing or broken files. Your settings, saves and games are kept."
            kind: "action"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Reinstall"
            label_text: "written"
            new_desc: "Reinstalls the latest version to repair missing or broken files. Settings, saves and games are kept."
            text: "written"
      - heading: "the-console"
        label: "THE CONSOLE"
        rows:
          - id: "PS5.ThreadedRecording"
            label: "Graphics driver on its own thread"
            desc: "Runs the graphics driver on its own CPU thread. Usually faster in demanding games."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "More"
            origin: "crux2"
            layers: "shared"
            new_label: "Threaded Graphics Driver"
            label_text: "written"
            new_desc: "Runs the graphics driver on a CPU thread of its own. Usually faster in demanding games."
            text: "written"
          - id: "PS5.GpuWaitSpinUs"
            label: "Wait for the GPU: checking for"
            desc: "How long the driver keeps checking whether the GPU is done before it starts sleeping between checks."
            kind: "intrange"
            area: "System"
            section: "PlayStation 5"
            level: "More"
            origin: "crux2"
            layers: "shared"
