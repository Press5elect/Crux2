        rows:
          - id: "EmuCore/GS.upscale_multiplier@graphics/rendering"
            label: "Internal Resolution"
            desc: "Multiplies the render resolution by the specified factor (upscaling)."
            choices: ["Native (PS2)", "2x Native (~720px/HD)", "3x Native (~1080px/FHD)", "4x Native (~1440px/QHD)", "5x Native (~1800px/QHD+)", "6x Native (~2160px/4K UHD)", "7x Native (~2520px)", "8x Native (~2880px/5K UHD)", "9x Native (~3240px)", "10x Native (~3600px/6K UHD)", "11x Native (~3960px)", "12x Native (~4320px/8K UHD)"]
