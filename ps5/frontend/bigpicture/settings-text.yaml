            desc: "Determines when the boot log is written to \"crux2-boot.log\". On Error keeps the log in memory and writes it after a crash, a game that failed to start, 15 seconds without a new frame during a game, or Save Log. Always writes every line as it is logged."
            choices: ["On Error (Default)", "Always"]
            kind: "stringlist"
            area: "System"
            section: "Log"
            level: "Essentials"
