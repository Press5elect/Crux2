            desc: "Steady aim: in both hands, or stood upright in one hand with your index finger on R2 like a pistol. Either: read from how you hold it when the aim is centred."
            choices: ["Either", "In both hands", "Upright in one hand"]
            kind: "stringlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Controller Grip"
            label_text: "written"
            new_desc: "Selects how the controller is held for absolute aiming: in both hands, or upright in one hand with the index finger on R2 like a pistol. Automatic detects it from how the controller is held when the aim is recentered."
            text: "written"
            new_choices: ["Automatic (Default)", "Both Hands", "Upright in One Hand"]
            choices_text: "written"
          - id: "PS5.GunConTriggerFeel"
            label: "R2's click for the light gun"
            desc: "While a GunCon 2 is plugged in, R2 resists and then gives way like a trigger, and the shot comes with the click."
