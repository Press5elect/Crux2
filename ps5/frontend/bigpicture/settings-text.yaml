            label: "Save Log"
            desc: "Writes this session's log to \"crux2-boot.log\", and the rest of the session's lines as they come. For problems that were not detected automatically."
            kind: "action"
            area: "System"
            section: "Log"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
