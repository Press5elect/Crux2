  - page: "graphics"
    name: "Graphics"
    headings:
      - heading: "quick-setup"
        label: "QUICK SETUP"
        rows:
          - id: "action:fastest"
            label: "Fastest"
            desc: "The PlayStation 2's own resolution, nothing extra: for a game that is slow at any setting"
            kind: "action"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            new_label: "Fastest"
            label_text: "written"
            new_desc: "Renders at the PS2's native resolution with no extra processing. For games that are slow at any setting."
            text: "written"
          - id: "action:balanced"
            label: "Balanced"
            desc: "Drawn at about 1080p, a little sharper textures: the choice for most games"
            kind: "action"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            new_label: "Balanced"
            label_text: "written"
            new_desc: "Renders at about 1080p with slightly sharper textures. Suits most games."
            text: "written"
          - id: "action:sharpest"
            label: "Sharpest"
            desc: "Drawn at about 1440p and brought to 4K with AMD FSR 1, the sharpest textures: for a game with speed to spare"
            kind: "action"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            new_label: "Sharpest"
            label_text: "written"
            new_desc: "Renders at about 1440p and upscales to 4K with AMD FSR 1, with the sharpest textures. For games with performance to spare."
            text: "written"
          - id: "EmuCore/GS.PS5AutoQuality"
            label: "Automatic quality"
            desc: "Lowers the internal resolution when the game can't hold full speed, and raises it again when there's room. Doesn't help when the CPU is the bottleneck."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            new_label: "Automatic Quality"
            label_text: "written"
            new_desc: "Lowers the internal resolution when the game cannot hold full speed, and raises it again when there is headroom. Does not help when the CPU is the bottleneck."
            text: "written"
      - heading: "display"
        label: "DISPLAY"
        rows:
          - id: "EmuCore/GS.Renderer"
            label: "Renderer"
            desc: "Selects how the emulated GS is drawn: Hardware uses the GPU, Software uses the CPU like the PS2 did (slow but accurate), paraLLEl-GS emulates the GS on the GPU at high accuracy."
            choices: ["Hardware (Vulkan)", "Software", "paraLLEl-GS"]
            kind: "combo"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Graphics API"
            pcsx2_description: "Selects the API used to render the emulated GS."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3114"
            new_label: "Graphics API"
            label_text: "exact"
            label_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3114"
            new_desc: "Selects the API used to render the emulated GS."
            text: "exact"
            text_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3114"
            new_choices: ["Vulkan", "Software Renderer", "paraLLEl-GS"]
            choices_text: "mixed"
            choices_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2857"
          - id: "EmuCore/GS.PS5ParallelGSSamples"
            label: "paraLLEl-GS samples"
            desc: "How many samples paraLLEl-GS takes per pixel. More samples give a smoother, sharper picture but need more GPU power."
            choices: ["1 (the PS2's picture)", "2", "4", "8", "16"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            new_label: "paraLLEl-GS Samples"
            label_text: "written"
            new_desc: "Determines how many samples paraLLEl-GS takes per pixel. More samples give a smoother, sharper picture. Higher values reduce performance."
            text: "written"
            new_choices: ["1 (Native)", "2", "4", "8 (Default)", "16"]
            choices_text: "written"
          - id: "EmuCore/GS.PS5ParallelGSHighRes"
            label: "paraLLEl-GS at twice the size"
            desc: "Renders at twice the PS2's resolution when using 4 or more samples. Sharper, but needs more GPU power."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            new_label: "paraLLEl-GS Double Resolution"
            label_text: "written"
            new_desc: "Renders at twice the PS2's resolution when using 4 or more samples. Sharper, but reduces performance."
            text: "written"
          - id: "EmuCore/GS.PS5ParallelGSSharp2D"
            label: "paraLLEl-GS sharp 2-D"
            desc: "Applies super-sampling to text, menus and other 2D elements. Sharper, but may cause seams in some games."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            new_label: "paraLLEl-GS Sharp 2D"
            label_text: "written"
            new_desc: "Applies super-sampling to text, menus and other 2D elements. Sharper, but may cause seams in some games."
            text: "written"
          - id: "EmuCore/GS.PS5ParallelGSEarlySubmit"
            label: "paraLLEl-GS hands work over as it goes (experimental)"
            desc: "Sends work to the GPU while the frame is still being recorded. Can help games that read back the screen. Experimental."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            new_label: "paraLLEl-GS Early Submit"
            label_text: "written"
            new_desc: "Submits work to the GPU while the frame is still being recorded. Can help games that read back the screen. May cause issues in some games."
            text: "written"
          - id: "EmuCore/GS.PS5ParallelGSTextures"
            label: "paraLLEl-GS full-detail effects"
            desc: "Keeps full detail in effects that render to a texture, such as blur, glow and depth of field. Needs more GPU power."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            new_label: "paraLLEl-GS Full-Detail Effects"
            label_text: "written"
            new_desc: "Keeps full detail in effects that render to a texture, such as blur, glow and depth of field. Reduces performance."
            text: "written"
          - id: "EmuCore/GS.PS5ParallelGSSharedFrames"
            label: "paraLLEl-GS pictures shared with the graphics device (experimental)"
            desc: "Passes paraLLEl-GS frames to the display without copying them on the CPU. Experimental."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            new_label: "paraLLEl-GS Shared Frames"
            label_text: "written"
            new_desc: "Passes paraLLEl-GS frames to the display without copying them on the CPU. May cause issues in some games."
            text: "written"
          - id: "EmuCore/GS.AspectRatio"
            label: "Aspect ratio"
            desc: "Selects the aspect ratio to display the game content at."
            choices: ["Stretch to fill the screen", "Automatic (4:3 or 3:2)", "4:3", "16:9", "10:7"]
