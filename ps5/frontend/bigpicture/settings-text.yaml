  - page: "graphics"
    name: "Graphics"
    headings:
      - heading: "quick-setup"
        label: "QUICK SETUP"
        rows:
          - id: "action:fastest"
            label: "Fastest"
            desc: "Renders at the PS2's native resolution with no extra processing. For games that are slow at any setting."
            kind: "action"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "action:balanced"
            label: "Balanced"
            desc: "Renders at about 1080p with slightly sharper textures. Suits most games."
            kind: "action"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "action:sharpest"
            label: "Sharpest"
            desc: "Renders at about 1440p and upscales to 4K with AMD FSR 1, with the sharpest textures. For games with performance to spare."
            kind: "action"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5AutoQuality"
            label: "Automatic Quality"
            desc: "Lowers the internal resolution when the game cannot hold full speed, and raises it again when there is headroom. Does not help when the CPU is the bottleneck."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5FreeStaleTargets"
            label: "Free Unused Targets When Memory Is Short"
            desc: "At very high resolutions, or with a texture pack, a heavy game can fill the console's graphics memory, and draws then go without their textures. Frees render targets that haven't been drawn to for two frames and whose picture is kept elsewhere, as is done after 60 frames anyway, when that happens or when targets hold more than 6 GB; when it happens, also the cached textures no draw uses (replacements are loaded again when needed). The resolution stays as you chose."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "Everything"
            origin: "crux2"
            label_text: "written"
            text: "written"
      - heading: "display"
        label: "DISPLAY"
        rows:
          - id: "EmuCore/GS.Renderer"
            label: "Graphics API"
            desc: "Selects the API used to render the emulated GS."
            choices: ["Vulkan", "Software Renderer", "paraLLEl-GS"]
            kind: "combo"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Graphics API"
            pcsx2_description: "Selects the API used to render the emulated GS."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3120"
            label_text: "exact"
            label_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3120"
            text: "exact"
            text_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3120"
            choices_text: "mixed"
            choices_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2857"
          - id: "EmuCore/GS.PS5ParallelGSSamples"
            label: "paraLLEl-GS Samples"
            desc: "Determines how many samples paraLLEl-GS takes per pixel. More samples give a smoother, sharper picture. Higher values reduce performance."
            choices: ["1 (Native)", "2", "4", "8 (Default)", "16"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "EmuCore/GS.PS5ParallelGSHighRes"
            label: "paraLLEl-GS Double Resolution"
            desc: "Renders at twice the PS2's resolution when using 4 or more samples. Sharper, but reduces performance."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5ParallelGSSharp2D"
            label: "paraLLEl-GS Sharp 2D"
            desc: "Applies super-sampling to text, menus and other 2D elements. Sharper, but may cause seams in some games."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5ParallelGSEarlySubmit"
            label: "paraLLEl-GS Early Submit"
            desc: "Submits work to the GPU while the frame is still being recorded. Can help games that read back the screen. May cause issues in some games."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5ParallelGSTextures"
            label: "paraLLEl-GS Full-Detail Effects"
            desc: "Keeps full detail in effects that render to a texture, such as blur, glow and depth of field. Reduces performance."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5ParallelGSSharedFrames"
            label: "paraLLEl-GS Shared Frames"
            desc: "Passes paraLLEl-GS frames to the display without copying them on the CPU. May cause issues in some games."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.AspectRatio"
            label: "Aspect Ratio"
            desc: "Selects the aspect ratio to display the game content at."
            choices: ["Stretch", "Auto 4:3/3:2", "4:3", "16:9", "10:7"]
            kind: "stringlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Aspect Ratio"
            pcsx2_description: "Selects the aspect ratio to display the game content at."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3124"
            pcsx2_tooltip: "Changes the aspect ratio used to display the console's output to the screen. The default is Auto Standard (4:3/3:2 Progressive) which automatically adjusts the aspect ratio to match how a game would be shown on a typical TV of the era, and adapts to widescreen/ultrawide game patches."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:457"
            label_text: "exact"
            label_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3124"
            text: "exact"
            text_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3124"
            choices_text: "exact"
            choices_source: "pcsx2/Pcsx2Config.cpp:639"
          - id: "EmuCore/GS.FMVAspectRatioSwitch"
            label: "FMV Aspect Ratio Override"
            desc: "Selects the aspect ratio for display when a FMV is detected as playing."
            choices: ["Off", "Auto 4:3/3:2", "4:3", "16:9", "10:7"]
            kind: "stringlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "FMV Aspect Ratio Override"
            pcsx2_description: "Selects the aspect ratio for display when a FMV is detected as playing."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3127"
            pcsx2_tooltip: "Overrides the full-motion video (FMV) aspect ratio. If disabled, the FMV Aspect Ratio will match the same value as the general Aspect Ratio setting."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:445"
            label_text: "exact"
            label_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3127"
