  - page: "graphics"
    name: "Graphics"
    headings:
      - heading: "quick-setup"
        label: "QUICK SETUP"
        rows:
          - id: "action:fastest"
            label: "Fastest"
            desc: "The PlayStation 2's own resolution, nothing extra: for a game that is slow at any setting"
            kind: "action"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
          - id: "action:balanced"
            label: "Balanced"
            desc: "Drawn at about 1080p, a little sharper textures: the choice for most games"
            kind: "action"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
          - id: "action:sharpest"
            label: "Sharpest"
            desc: "Drawn at about 1440p and brought to 4K with AMD FSR 1, the sharpest textures: for a game with speed to spare"
            kind: "action"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
          - id: "EmuCore/GS.PS5AutoQuality"
            label: "Automatic quality"
            desc: "Lowers the internal resolution when the game can't hold full speed, and raises it again when there's room. Doesn't help when the CPU is the bottleneck."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
      - heading: "display"
        label: "DISPLAY"
        rows:
          - id: "EmuCore/GS.Renderer"
            label: "Renderer"
            desc: "Selects how the emulated GS is drawn: Hardware uses the GPU, Software uses the CPU like the PS2 did (slow but accurate), paraLLEl-GS emulates the GS on the GPU at high accuracy."
            choices: ["Hardware (Vulkan)", "Software", "paraLLEl-GS"]
            kind: "combo"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Graphics API"
            pcsx2_description: "Selects the API used to render the emulated GS."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3114"
          - id: "EmuCore/GS.PS5ParallelGSSamples"
            label: "paraLLEl-GS samples"
            desc: "How many samples paraLLEl-GS takes per pixel. More samples give a smoother, sharper picture but need more GPU power."
            choices: ["1 (the PS2's picture)", "2", "4", "8", "16"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.PS5ParallelGSHighRes"
            label: "paraLLEl-GS at twice the size"
            desc: "Renders at twice the PS2's resolution when using 4 or more samples. Sharper, but needs more GPU power."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.PS5ParallelGSSharp2D"
            label: "paraLLEl-GS sharp 2-D"
            desc: "Applies super-sampling to text, menus and other 2D elements. Sharper, but may cause seams in some games."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.PS5ParallelGSEarlySubmit"
            label: "paraLLEl-GS hands work over as it goes (experimental)"
            desc: "Sends work to the GPU while the frame is still being recorded. Can help games that read back the screen. Experimental."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.PS5ParallelGSTextures"
            label: "paraLLEl-GS full-detail effects"
            desc: "Keeps full detail in effects that render to a texture, such as blur, glow and depth of field. Needs more GPU power."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.PS5ParallelGSSharedFrames"
            label: "paraLLEl-GS pictures shared with the graphics device (experimental)"
            desc: "Passes paraLLEl-GS frames to the display without copying them on the CPU. Experimental."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.AspectRatio"
            label: "Aspect ratio"
            desc: "Selects the aspect ratio to display the game content at."
            choices: ["Stretch to fill the screen", "Automatic (4:3 or 3:2)", "4:3", "16:9", "10:7"]
            kind: "stringlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Aspect Ratio"
            pcsx2_description: "Selects the aspect ratio to display the game content at."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3118"
            pcsx2_tooltip: "Changes the aspect ratio used to display the console's output to the screen. The default is Auto Standard (4:3/3:2 Progressive) which automatically adjusts the aspect ratio to match how a game would be shown on a typical TV of the era, and adapts to widescreen/ultrawide game patches."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:457"
          - id: "EmuCore/GS.FMVAspectRatioSwitch"
            label: "FMV aspect ratio override"
            desc: "Selects the aspect ratio for display when a FMV is detected as playing."
            choices: ["The same as the game", "Automatic (4:3 or 3:2)", "4:3", "16:9", "10:7"]
            kind: "stringlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "FMV Aspect Ratio Override"
            pcsx2_description: "Selects the aspect ratio for display when a FMV is detected as playing."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3121"
            pcsx2_tooltip: "Overrides the full-motion video (FMV) aspect ratio. If disabled, the FMV Aspect Ratio will match the same value as the general Aspect Ratio setting."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:445"
          - id: "EmuCore/GS.SidePicture"
            label: "Beside a 4:3 picture"
            desc: "What fills the sides of the screen when the game is 4:3. Dark grey wears an OLED screen more evenly than black."
            choices: ["Black", "Dark grey", "A blurred copy of the picture"]
            kind: "combo"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
          - id: "EmuCore/GS.deinterlace_mode"
            label: "Deinterlacing"
            desc: "Determines the deinterlacing method to be used on the interlaced screen of the emulated console. Automatic should be able to correctly deinterlace most games, but if you see visibly shaky graphics, try one of the other options."
            choices: ["Automatic", "Off", "Weave (top field first)", "Weave (bottom field first)", "Bob (top field first)", "Bob (bottom field first)", "Blend (top field first)", "Blend (bottom field first)", "Adaptive (top field first)", "Adaptive (bottom field first)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Deinterlacing"
            pcsx2_description: "Determines the deinterlacing method to be used on the interlaced screen of the emulated console.\nAutomatic should be able to correctly deinterlace most games, but if you see visibly shaky graphics, try one of the other options."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3124"
            pcsx2_tooltip: "Determines the deinterlacing method to be used on the interlaced screen of the emulated console. Automatic should be able to correctly deinterlace most games, but if you see visibly shaky graphics, try one of the other options."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:461"
          - id: "EmuCore/GS.linear_present_mode"
            label: "Bilinear filtering"
            desc: "Smooths out the image when upscaling the console to the screen."
            choices: ["Off (pixels)", "Bilinear (soft)", "Bilinear (sharp)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Bilinear Filtering"
            pcsx2_description: "Smooths out the image when upscaling the console to the screen."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3144"
            pcsx2_tooltip: "Enables bilinear post processing filter. Smooths the overall picture as it is displayed on the screen. Corrects positioning between pixels."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:433"
          - id: "EmuCore.EnableWideScreenPatches"
            label: "Widescreen patches"
            desc: "Automatically loads and applies widescreen patches on game start. Can cause issues."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
