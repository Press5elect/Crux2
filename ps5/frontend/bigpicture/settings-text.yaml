      - heading: "the-console-s-controllers"
        label: "THE CONSOLE'S CONTROLLERS"
        rows:
          - id: "PS5.LeaveGameCombo"
            label: "Leave a game by holding"
            desc: "Hold these buttons to leave the game."
            choices: ["L3 and R3", "L1, R1, L3 and R3", "Nothing (off)"]
            kind: "stringlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.LeaveGameHoldSeconds"
            label: "Held for"
            desc: ""
            choices: ["1 second", "2 seconds", "3 seconds"]
            kind: "floatlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.PressureFromR2"
            label: "Pressure from R2"
            desc: "For games that use pressure-sensitive buttons: how far you pull R2 sets how hard the face buttons and D-pad are pressed."
            kind: "toggle"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.StickCurveLeft"
            label: "Left stick response"
            desc: "Linear: as the stick is pushed. Gentle to Gentlest: a small push moves less, for finer control near the centre; a full push still goes all the way."
            choices: ["Linear", "Gentle", "Gentler", "Gentlest"]
            kind: "stringlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.StickCurveRight"
            label: "Right stick response"
            desc: "Linear: as the stick is pushed. Gentle to Gentlest: a small push moves less, for finer control near the centre; a full push still goes all the way."
            choices: ["Linear", "Gentle", "Gentler", "Gentlest"]
            kind: "stringlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.MotionAim"
            label: "Aim with motion"
            desc: "Aims the GunCon 2 light gun by moving the controller (always, while a GunCon 2 is plugged in). Hold R3 a moment to recentre; hold it for two seconds to measure the screen."
            kind: "toggle"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.MotionAimMode"
            label: "Aim"
            desc: "Steady: where the controller points is where the gun aims, and it does not drift away. Like a mouse: the aim of before, which adds up the controller's turns and stops at the edges."
            choices: ["Steady (new)", "Like a mouse (before)"]
            kind: "stringlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.MotionAimSpeed"
            label: "Aim speed"
            desc: "How far you turn the controller to aim at the edge of the screen (steady aim). Your screen: as measured by pointing at its corners."
            choices: ["Your screen (measured)", "1 (slowest)", "2", "3", "4", "5", "6", "7", "8", "9", "10 (fastest)"]
            kind: "intlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "action:measure-the-screen"
            label: "Measure the screen"
            desc: "Back in the game, point at the screen's top-left corner and press R3, then at its bottom-right corner and press R3. Holding R3 for two seconds in a game does the same."
            kind: "action"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.MotionAimSmoothing"
            label: "Aim smoothing"
            desc: "Steadies a still hand without slowing a quick sweep (steady aim)."
            choices: ["Off", "Light", "Medium", "Strong"]
            kind: "intlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.MotionAimGrip"
            label: "Holding the controller"
            desc: "Steady aim: in both hands, or stood upright in one hand with your index finger on R2 like a pistol. Either: read from how you hold it when the aim is centred."
            choices: ["Either", "In both hands", "Upright in one hand"]
            kind: "stringlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.GunConTriggerFeel"
            label: "R2's click for the light gun"
            desc: "While a GunCon 2 is plugged in, R2 resists and then gives way like a trigger, and the shot comes with the click."
            choices: ["Off", "Light", "Firm"]
            kind: "stringlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.MotionAimSensitivity"
            label: "Aim like a mouse: how far to turn to the edge"
            desc: "How far you need to turn the controller to aim at the edge of the screen (the aim like a mouse)."
            kind: "intrange"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.MoveAim"
            label: "Aim with a PlayStation Move (Move Management)"
            desc: "Player 1 aims the GunCon 2 with a PlayStation Move, and a Navigation controller works its D-pad. Needs the Move Management payload running. Press Select on the Move to recentre."
            kind: "toggle"
            area: "Controls"
            section: "PS Move"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.USBKeyboard"
            label: "USB keyboard"
            desc: "Lets a USB keyboard type in the menus, and act as a PS2 keyboard in games that support one."
            kind: "toggle"
            area: "Controls"
            section: "USB devices"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.USBPads"
            label: "USB controllers (experimental)"
            desc: "Lets you use controllers plugged into the console's USB ports, such as a DualShock 3, Xbox 360 pads, guitars and drums. Experimental."
            kind: "toggle"
            area: "Controls"
            section: "USB devices"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
