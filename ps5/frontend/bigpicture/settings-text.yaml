            choices_text: "exact"
            choices_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3446"
          - id: "EmuCore/GS.Look"
            label: "Shader Preset"
            desc: "Applies a shader preset that makes the picture look like an old TV, with CRT shaders, composite or S-Video signal effects, and film grain."
            choices: ["None (Default)", "CRT (Fast)", "CRT (Fastest)", "CRT (Finest, Slow at 4K)", "CRT with Composite Signal", "Composite Signal", "S-Video Signal", "Film Grain", "Warmer Colors"]
            kind: "stringlist"
            area: "Picture"
            section: "Looks"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "action:a-look-of-your-own"
            label: "Load Custom Shader Preset"
            desc: "Loads a libretro shader preset (.slangp) from a \"shaders\" folder on a USB drive or in the title folder."
            kind: "action"
            area: "Picture"
            section: "Looks"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "PS5.Deband"
            label: "Debanding"
            desc: "Smooths the color bands in skies, fog and dark gradients while keeping edges and detail. Low removes the fine steps of 32-bit color; High removes the wider steps of 16-bit color."
            choices: ["Off (Default)", "Low", "High"]
            kind: "intlist"
            area: "Picture"
            section: "Looks"
            level: "Essentials"
            origin: "crux2"
            doubtful: "the last pass before the screen: or Picture > Output and HDR?"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.ColourFilter"
            label: "Color Blindness Filter"
            desc: "Shifts colors that are hard to tell apart to ones that are easier to distinguish. Red-Weak and Green-Weak help with reds and greens; Blue-Weak with blues and yellows. Applies to the game's picture only."
            choices: ["Off (Default)", "Red-Weak", "Green-Weak", "Blue-Weak", "Grayscale"]
            kind: "intlist"
            area: "Picture"
