  - page: "controllers"
    name: "Controllers"
    headings:
      - heading: "controller-profiles"
        label: "CONTROLLER PROFILES"
        rows:
          - id: "EmuCore.InputProfileName"
            label: "This game's controls"
            desc: "Uses a saved controller profile for this game."
            choices: ["As in Settings"]
            kind: "stringlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "pcsx2"
            layers: "game"
          - id: "action:save-the-controls-as-a-profile"
            label: "Save the controls as a profile..."
            desc: "Saves the current button mappings as a profile."
            kind: "action"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
          - id: "action:load-a-profile-into-the-controls"
            label: "Load a profile into the controls..."
            desc: "Loads a profile's button mappings, replacing the current ones."
            kind: "action"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
          - id: "action:make-a-profile-with-cross-and-circle-swapped"
            label: "Make a profile with Cross and Circle swapped"
            desc: "Saves a profile with Cross and Circle swapped, for Japanese games."
            kind: "action"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
      - heading: "all-ports"
        label: "ALL PORTS"
        rows:
          - id: "action:put-the-buttons-back-as-they-were"
            label: "Put the buttons back as they were"
            desc: "Resets all controller ports and hotkeys to their default buttons."
            kind: "action"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
      - heading: "singstar"
        label: "SINGSTAR"
        rows:
          - id: "PS5.SingStar"
            label: "SingStar microphones"
            desc: "Uses the controller's microphone or a headset as the PS2's USB microphones, for SingStar and other singing games."
            choices: ["None", "One: player 1's", "Two: players 1 and 2"]
            kind: "intlist"
            area: "Controls"
            section: "USB devices"
            level: "Essentials"
            origin: "crux2"
            doubtful: "the PS2's USB microphones: or Sound?"
          - id: "action:test-player-1-s-microphone"
            label: "Test player 1's microphone"
            desc: "Speak or sing for five seconds; it is played back to you as a game would hear it, and the boot log's \"mic test\" lines say how the microphone did. Close the game first"
            kind: "action"
            area: "Controls"
            section: "USB devices"
            level: "Essentials"
            origin: "crux2"
            doubtful: "the PS2's USB microphones: or Sound?"
          - id: "action:test-player-2-s-microphone"
            label: "Test player 2's microphone"
            desc: "Speak or sing for five seconds; it is played back to you as a game would hear it, and the boot log's \"mic test\" lines say how the microphone did. Close the game first"
            kind: "action"
            area: "Controls"
            section: "USB devices"
            level: "Essentials"
            origin: "crux2"
            doubtful: "the PS2's USB microphones: or Sound?"
      - heading: "light-gun"
        label: "LIGHT GUN"
        rows:
          - id: "PS5.LightGun"
            label: "Light gun (GunCon 2)"
            desc: "Plugs a GunCon 2 into the PS2's USB port 1, or two GunCon 2s into ports 1 and 2 for two players, for light-gun games. Choose it for those games only (in their own options): a game that does not expect a light gun may not see its controller. Two guns take USB port 2, which the SingStar microphones use too."
            choices: ["None", "One: player 1's", "Two: players 1 and 2"]
            kind: "intlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
      - heading: "players"
        label: "PLAYERS"
        rows:
          - id: "action:one-or-two-players"
            label: "One or two players"
            desc: "Player 1 on port 1, player 2 on port 2, no multitap."
