      - heading: "post-processing"
        label: "POST-PROCESSING"
        rows:
          - id: "PS5.AntiAliasing"
            label: "Anti-Aliasing"
            desc: "Smooths the jagged edges of the picture. FXAA is fast but slightly soft; SMAA gives sharper edges at a small cost; SSAA scales the picture of the chosen internal resolution down to the screen, for the least shimmer when it is larger than the screen (6x and up at 4K), and disables FSR 1 while chosen; SSAA + SMAA applies both."
            choices: ["Off (Default)", "FXAA", "SMAA", "SSAA", "SSAA + SMAA"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.SSAAFilter"
            label: "SSAA Filter"
            desc: "Selects how SSAA scales the picture down to the screen. Soft averages every pixel covered, with the least shimmer. Sharp uses a Lanczos filter for crisper edges."
            choices: ["Soft (Default)", "Sharp"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "EmuCore/GS.TVShader"
            label: "TV Shader"
            desc: "Applies a shader which replicates the visual effects of different styles of television sets."
            choices: ["None (Default)", "Scanline Filter", "Diagonal Filter", "Triangular Filter", "Wave Filter", "Lottes CRT", "4xRGSS", "NxAGSS"]
            kind: "intlist"
            area: "Picture"
            section: "Looks"
            level: "More"
            origin: "pcsx2"
