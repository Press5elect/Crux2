            pcsx2_description: "Selects the type of dithering applies when the game requests it."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3181"
            pcsx2_tooltip: "Reduces banding between colors and improves the perceived color depth.<br> Off: Disables any dithering.<br> Scaled: Upscaling-aware / Highest dithering effect.<br> Unscaled: Native dithering / Lowest dithering effect, does not increase size of squares when upscaling.<br> Force 32bit: Treats all draws as if they were 32bit to avoid banding and dithering."
