      - heading: "frame-pacing-latency-control"
        label: "FRAME PACING / LATENCY CONTROL"
        rows:
          - id: "PS5.OutputRefresh"
            label: "Refresh Rate"
            desc: "Selects the refresh rate sent to the TV. 120 Hz requires a TV that supports it and is needed for frame generation to 120 FPS and black frame insertion. Holding L1 and R1 during startup uses 60 Hz once."
            choices: ["120 Hz When Supported", "60 Hz (Default)"]
            kind: "intlist"
            area: "Picture"
            section: "Output and HDR"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.VariableRefresh"
            label: "Variable Refresh Rate (VRR)"
            desc: "At 120 Hz on a TV that supports VRR, shows each frame as soon as it is ready instead of at the next fixed refresh. Smoother when a game runs below full speed."
            kind: "toggle"
            area: "Picture"
            section: "Output and HDR"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.UseVSyncForTiming"
            label: "Frame Pacing"
            desc: "Determines how frames are paced. Host VSync paces frames by the display's refresh for the smoothest motion; Internal Timing paces them by the emulator's clock, for games whose frame rate the display cannot match."
            choices: ["Host VSync (Smoothest)", "Internal Timing, Synced to Host", "Internal Timing, Game's Rate"]
            kind: "combo"
            area: "Emulation"
            section: "Frame Pacing"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Use Host VSync Timing"
            pcsx2_description: "Disables PCSX2's internal frame timing, and uses host vsync instead."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2768"
            pcsx2_tooltip: "When synchronizing with the host refresh rate, this option disables PCSX2's internal frame timing and uses the host instead. Can result in smoother frame pacing, <strong>but at the cost of increased input latency</strong>."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:151"
            doubtful: "frame pacing: or Picture > Output and HDR?"
            label_text: "written"
            text: "written"
            text_note: "PCSX2's text was untrue of this row; written in PCSX2's style instead (the owner's decision of 2026-11-15)"
            choices_text: "written"
          - id: "EmuCore/GS.VsyncQueueSize"
            label: "Maximum Frame Latency"
            desc: "Sets the number of frames which can be queued."
            choices: ["0 Frames (Hard Sync)", "1 Frame", "2 Frames", "3 Frames"]
            kind: "intlist"
            area: "Emulation"
            section: "Frame Pacing"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Maximum Frame Latency"
            pcsx2_description: "Sets the number of frames which can be queued."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2744"
            pcsx2_tooltip: "Sets the maximum number of frames that can be queued up to the GS, before the CPU thread will wait for one of them to complete before continuing. Higher values can assist with smoothing out irregular frame times, but increase input lag."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:140"
            doubtful: "frame pacing: or Picture > Output and HDR?"
            label_text: "exact"
            label_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2744"
            text: "exact"
            text_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2744"
            choices_text: "exact"
            choices_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2656"
          - id: "EmuCore/GS.PS5AutoFrameQueue"
            label: "Queue Frames When Slow"
            desc: "When a game runs below full speed, allows up to 2 frames to be queued so the emulator and the GS thread can work at the same time. Can increase input lag while the game is slow."
            kind: "toggle"
            area: "Emulation"
            section: "Frame Pacing"
            level: "More"
            origin: "crux2"
            doubtful: "frame pacing: or Picture > Output and HDR?"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.AdvancedFrameDisplay"
            label: "Advanced Frame Display"
            desc: "Displays the newest frame immediately at the beginning of the frame raster time, instead of at the end. Can reduce perceived input lag, but may cause problems with some games, such as Soulcalibur II and Baldur's Gate Dark Alliance II. "
            kind: "toggle"
            area: "Emulation"
            section: "Frame Pacing"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Advanced Frame Display"
            pcsx2_description: "Displays the newest frame immediately at the beginning of the frame raster time, instead of at the end. Can reduce perceived input lag, but may cause problems with some games, such as Soulcalibur II and Baldur's Gate Dark Alliance II. "
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2755"
            pcsx2_tooltip: "Displays the newest frame immediately at the beginning of the frame raster time, instead of at the end. Can reduce perceived input lag, but may cause problems with some games, such as Soulcalibur II and Baldur's Gate Dark Alliance II."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:159"
            doubtful: "frame pacing: or Picture > Output and HDR?"
            label_text: "exact"
            label_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2755"
            text: "exact"
            text_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2755"
          - id: "EmuCore/GS.SkipDuplicateFrames"
            label: "Skip Presenting Duplicate Frames"
            desc: "Skips displaying frames that don't change in 25/30fps games. Can improve speed, but increase input lag/make frame pacing worse."
            kind: "toggle"
            area: "Emulation"
            section: "Frame Pacing"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Skip Presenting Duplicate Frames"
            pcsx2_description: "Skips displaying frames that don't change in 25/30fps games. Can improve speed, but increase input lag/make frame pacing worse."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3580"
            pcsx2_tooltip: "Detects when idle frames are being presented in 25/30fps games, and skips presenting those frames. The frame is still rendered, it just means the GPU has more time to complete it (this is NOT frame skipping). Can smooth out frame time fluctuations when the CPU/GPU are near maximum utilization, but makes frame pacing more inconsistent and can increase input lag. Helps when using frame generation on 25/30fps games."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:154"
            doubtful: "frame pacing: or Picture > Output and HDR?"
            label_text: "exact"
            label_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3580"
            text: "exact"
            text_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3580"
          - id: "EmuCore/GS.BlackFrameInsertion"
            label: "Black Frame Insertion"
            desc: "Inserts a black frame after each frame at 120 Hz to reduce motion blur. Makes the picture darker. Cannot be combined with frame generation."
            kind: "toggle"
            area: "Picture"
            section: "Output and HDR"
            level: "More"
            origin: "crux2"
            doubtful: "with the frame pacing today; or Emulation > Emulation"
            label_text: "written"
            text: "written"
