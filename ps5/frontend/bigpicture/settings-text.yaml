            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5GSSplit"
            label: "GS Thread Split"
            desc: "Splits the GS thread in two: one reads the game's graphics commands, the other draws. Can improve performance in games limited by the GS thread. Check does the same work on one thread, to compare the picture."
            choices: ["Off", "Check (One Thread)", "On (Two Threads)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "EmuCore/GS.PS5ReuseRTCopies"
            label: "Reuse Render Target Copies"
            desc: "Reuses copies of the screen for glow and blur effects when nothing has changed. Disable it if an effect looks a frame behind."
