            choices_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2898"
          - id: "EmuCore/GS.linear_present_mode"
            label: "Bilinear Filtering"
            desc: "Smooths out the image when upscaling the console to the screen."
            choices: ["Off", "Bilinear (Smooth)", "Bilinear (Sharp)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
