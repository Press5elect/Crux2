          - id: "EmuCore/GS.FrameGeneration"
            label: "Frame Generation"
            desc: "Generates extra frames between the game's frames, so a 30 FPS game is shown at 60 FPS. Increases input lag slightly and can cause smearing on fast movement."
            choices: ["Off (Default)", "30 to 60 FPS", "30 to 60 FPS, 60 to 120 FPS at 120 Hz"]
            kind: "intlist"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "EmuCore/GS.FrameGenerationMethod"
            label: "Frame Generation Method"
            desc: "Selects how the extra frames are made. Default uses a motion search; AMD FSR 3 Optical Flow handles small, fast movement better and keeps static elements such as a score or a map still; MihawkGen uses a small trained network that looks only at the two frames and leaves unmoving parts as they were."
            choices: ["Default", "AMD FSR 3 Optical Flow", "MihawkGen"]
            kind: "intlist"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "EmuCore/GS.FrameGenerationQuality"
            label: "Optical Flow Quality"
            desc: "Determines the quality of the AMD FSR 3 optical flow. Higher quality reduces performance."
            choices: ["Performance", "Balanced (Default)", "Quality"]
            kind: "intlist"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "EmuCore/GS.FrameGenerationSkipVideos"
            label: "Disable Frame Generation During FMVs"
            desc: "Disables frame generation while the game plays an FMV."
            kind: "toggle"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.FrameGenerationSteady30"
            label: "Steady 30 FPS"
            desc: "Limits the game's frames to every second vsync, so a game that varies between 30 and 60 FPS is shown at an even 30 FPS that frame generation doubles to 60 FPS (120 FPS at 120 Hz). For games that cannot hold 60 FPS."
            kind: "toggle"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5FrameGenDebug"
            label: "Show Frame Generation Motion"
            desc: "Shows, in the generated frames, what AMD FSR 3 optical flow decided for each pixel instead of the picture: red for both frames, green for the newer only, blue for the older only, gray for a mix. For debugging only."
            kind: "toggle"
            area: "Picture"
            section: "Frame generation"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
