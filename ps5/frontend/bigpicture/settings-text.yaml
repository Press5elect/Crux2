            new_desc: "Calibrates the screen for motion aiming: back in the game, point at the top-left corner and press R3, then at the bottom-right corner and press R3. Holding R3 for two seconds during a game does the same."
            text: "written"
          - id: "PS5.MotionAimSmoothing"
            label: "Aim smoothing"
            desc: "Steadies a still hand without slowing a quick sweep (steady aim)."
            choices: ["Off", "Light", "Medium", "Strong"]
            kind: "intlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
