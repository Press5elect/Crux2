            choices_text: "exact"
            choices_source: "pcsx2/Pcsx2Config.cpp:647"
          - id: "EmuCore/GS.SidePicture"
            label: "Pillarbox Fill"
            desc: "Selects what fills the sides of the screen when the game is 4:3. Dark gray wears an OLED screen more evenly than black."
            choices: ["Black (Default)", "Dark Gray", "Blurred Picture"]
            kind: "combo"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "crux2"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "EmuCore/GS.deinterlace_mode"
            label: "Deinterlacing"
            desc: "Determines the deinterlacing method to be used on the interlaced screen of the emulated console.\nAutomatic should be able to correctly deinterlace most games, but if you see visibly shaky graphics, try one of the other options."
            choices: ["Automatic (Default)", "No Deinterlacing", "Weave (Top Field First, Sawtooth)", "Weave (Bottom Field First, Sawtooth)", "Bob (Top Field First)", "Bob (Bottom Field First)", "Blend (Top Field First, Half FPS)", "Blend (Bottom Field First, Half FPS)", "Adaptive (Top Field First)", "Adaptive (Bottom Field First)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Deinterlacing"
            pcsx2_description: "Determines the deinterlacing method to be used on the interlaced screen of the emulated console.\nAutomatic should be able to correctly deinterlace most games, but if you see visibly shaky graphics, try one of the other options."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3130"
            pcsx2_tooltip: "Determines the deinterlacing method to be used on the interlaced screen of the emulated console. Automatic should be able to correctly deinterlace most games, but if you see visibly shaky graphics, try one of the other options."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:461"
            label_text: "exact"
