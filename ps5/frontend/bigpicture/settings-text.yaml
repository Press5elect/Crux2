  - page: "playstation-5"
    name: "PlayStation 5"
    headings:
      - heading: "ps5-tuning"
        label: "PS5 TUNING"
        rows:
          - id: "PS5.ThreadPriorities"
            label: "Prioritize Audio and Input"
            desc: "Gives sound, controllers and menus priority over the emulator, and runs downloads and copies after it. Prevents crackling and late button presses."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.FastPipelines"
            label: "Fast Shader Compilation"
            desc: "Draws new effects with a quickly built shader first, then switches to the optimized one. Reduces stutter the first time an effect appears."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.WriteBroker"
            label: "Fast Writes to Console Storage"
            desc: "Large files written to the console's storage (texture packs moved or downloaded there, disc images) are written by a helper program the title starts, which the console does not slow down after the first 1.3 GB as it slows the title. If the helper fails, the title writes the rest itself, at its own speed."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
      - heading: "native-code-modules-experimental"
        label: "NATIVE CODE MODULES (EXPERIMENTAL)"
        rows:
          - id: "PS5.NativeModules"
            label: "Use Native Code Modules"
            desc: "Runs a game's code from a native module built with the recomp kit from your copy of the game. May cause issues in some games."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            doubtful: "how games' code runs: or Emulation > Advanced?"
            label_text: "written"
            text: "written"
          - id: "PS5.NativeExport"
            label: "Export Executables"
            desc: "Copies a game's executable to the network share when no module exists, so the recomp kit can build one."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            doubtful: "how games' code runs: or Emulation > Advanced?"
            label_text: "written"
            text: "written"
          - id: "PS5.NativeHardware"
            label: "Allow Hardware Access"
            desc: "Allows native modules to access the console's hardware directly. Disable it if a game hangs with its module."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            doubtful: "how games' code runs: or Emulation > Advanced?"
            label_text: "written"
            text: "written"
          - id: "PS5.NativeCheck"
            label: "Verify Native Code"
            desc: "Runs every function twice and compares the result with PCSX2's interpreter. Greatly reduces performance; for debugging only."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            doubtful: "how games' code runs: or Emulation > Advanced?"
            label_text: "written"
            text: "written"
      - heading: "updates"
        label: "UPDATES"
        rows:
          - id: "action:look-for-a-newer-crux2"
            label: "Check for Updates"
            desc: "Checks GitHub for a newer version. Nothing is downloaded without asking."
            kind: "action"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.UpdateAtStart"
            label: "Check for Updates on Startup"
            desc: "Checks GitHub for a newer version on startup. Nothing is downloaded without asking."
            kind: "toggle"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.FixesAtStart"
            label: "Update Game Fixes on Startup"
            desc: "Downloads, on startup, the game fixes (game database entries and game patches) changed since this version was built. They apply to games started afterwards."
            kind: "toggle"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "action:what-s-new"
            label: "What's New"
            desc: "Shows what was added, changed and fixed in each version, newest first."
            kind: "action"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "action:install-this-version-again"
            label: "Reinstall"
            desc: "Reinstalls the latest version to repair missing or broken files. Settings, saves and games are kept."
            kind: "action"
            area: "Network"
            section: "Updates"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
      - heading: "the-console"
        label: "THE CONSOLE"
        rows:
          - id: "PS5.ThreadedRecording"
            label: "Threaded Graphics Driver"
            desc: "Runs the graphics driver on a CPU thread of its own. Usually faster in demanding games."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "More"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.StreamZero"
            label: "Streamed Memory Clearing"
            desc: "Clears newly allocated graphics memory with non-temporal writes instead of clearing and flushing it. Reduces the time spent creating textures."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.SameMicroSkip"
            label: "Skip Unchanged Microprograms"
            desc: "Keeps the VU1 recompiler's programs when a game uploads microcode that equals what VU1 already holds. A game that changes microcode while VU1 runs it may draw wrongly. Not yet tested on a console."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.CoarseThreadTimes"
            label: "Coarse Thread Times"
            desc: "Threads note their processor time at most once a millisecond instead of each time they wake. Reading it is a system call on the console. The thread loads shown may lag by up to a millisecond of work."
            kind: "toggle"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.WakeSpinUs"
            label: "Wake-Up Spin Time"
            desc: "Determines how long a thread waiting for work keeps checking before it sleeps. Longer can wake threads sooner and costs processor time."
            kind: "intrange"
            area: "System"
            section: "PlayStation 5"
            level: "Everything"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.GpuWaitSpinUs"
            label: "GPU Wait Spin Time"
            desc: "Determines how long the driver keeps checking whether the GPU is done before it starts sleeping between checks."
            kind: "intrange"
            area: "System"
            section: "PlayStation 5"
            level: "More"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.GpuWaitSleepUs"
            label: "GPU Wait Sleep Time"
            desc: "Determines how long the driver sleeps between checks while waiting for the GPU."
            kind: "intrange"
            area: "System"
            section: "PlayStation 5"
            level: "More"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "action:profile-the-next-start"
            label: "Profile Next Start"
            desc: "Records detailed performance data on the next startup and writes it to \"crux2-boot.log\". Helps find out why a game is slow."
            kind: "action"
            area: "System"
            section: "PlayStation 5"
            level: "More"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
