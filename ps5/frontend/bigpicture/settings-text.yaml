            kind: "toggle"
            area: "Games and saves"
            section: "BIOS"
            level: "More"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Fast Forward Boot"
            pcsx2_description: "Removes emulation speed throttle until the game starts to reduce startup time."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2594"
            doubtful: "the start-up of a game: Emulation > Emulation?"
  - page: "emulation"
    name: "Emulation"
    headings:
      - heading: "speed-control"
        label: "SPEED CONTROL"
        rows:
          - id: "Framerate.NominalScalar"
            label: "Normal speed"
            desc: "Sets the speed when running without fast forwarding."
            choices: ["2%", "10%", "25%", "50%", "75%", "90%", "100%", "110%", "120%", "150%", "175%", "200%", "300%", "400%", "500%", "1000%"]
            kind: "floatlist"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Normal Speed"
            pcsx2_description: "Sets the speed when running without fast forwarding."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2682"
          - id: "Framerate.TurboScalar"
            label: "Fast-forward speed"
            desc: "Sets the speed when using the fast forward hotkey."
            choices: ["2%", "10%", "25%", "50%", "75%", "90%", "100%", "110%", "120%", "150%", "175%", "200%", "300%", "400%", "500%", "1000%"]
            kind: "floatlist"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Fast-Forward Speed"
            pcsx2_description: "Sets the speed when using the fast forward hotkey."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2684"
          - id: "Framerate.SlomoScalar"
            label: "Slow-motion speed"
            desc: "Sets the speed when using the slow motion hotkey."
            choices: ["2%", "10%", "25%", "50%", "75%", "90%", "100%", "110%", "120%", "150%", "175%", "200%", "300%", "400%", "500%", "1000%"]
            kind: "floatlist"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Slow-Motion Speed"
            pcsx2_description: "Sets the speed when using the slow motion hotkey."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2686"
      - heading: "system-settings"
        label: "SYSTEM SETTINGS"
        rows:
          - id: "EmuCore/Speedhacks.EECycleRate"
            label: "EE cycle rate"
            desc: "Underclocks or overclocks the emulated Emotion Engine CPU."
            choices: ["50%", "60%", "75%", "100% (the PS2's own)", "130%", "180%", "300%"]
            kind: "intlist"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "EE Cycle Rate"
            pcsx2_description: "Underclocks or overclocks the emulated Emotion Engine CPU."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2691"
          - id: "EmuCore/Speedhacks.EECycleSkip"
            label: "EE cycle skipping"
            desc: "Makes the emulated Emotion Engine skip cycles. Helps a small subset of games like SOTC. Most of the time it's harmful to performance."
            choices: ["Off", "Mild", "Moderate", "Maximum"]
            kind: "intlist"
            area: "Emulation"
            section: "Emulation"
            level: "Everything"
            origin: "pcsx2"
            pcsx2_title: "EE Cycle Skipping"
            pcsx2_description_withheld: "PCSX2's text names games (rule 4): read it at its source"
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2693"
          - id: "EmuCore/Speedhacks.vuThread"
            label: "Multi-threaded VU1 (MTVU)"
            desc: "Generally a speedup on CPUs with 4 or more cores. Safe for most games, but a few are incompatible and may hang."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Enable Multithreaded VU1 (MTVU)"
            pcsx2_description: "Generally a speedup on CPUs with 4 or more cores. Safe for most games, but a few are incompatible and may hang."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2696"
          - id: "PS5.ThreadLayout"
            label: "Thread pinning"
            desc: "How the emulator's threads are placed on the CPU cores. Anywhere is best for most games. Try another option if a game is slow at every resolution."
            choices: ["Anywhere", "Pinned (PCSX2)", "Cores of their own (Crux2)"]
            kind: "combo"
            area: "Emulation"
            section: "Emulation"
            level: "More"
            origin: "crux2"
            doubtful: "the console's threads: or System > PlayStation 5?"
          - id: "PS5.DriverOwnCore"
            label: "Graphics driver on a core of its own"
            desc: "With \"Cores of their own\", moves the graphics driver's thread off the GS thread's core, so the GS thread has its core to itself. Turn it off if a game runs slower with it. Takes effect the next time Crux2 starts."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "More"
            origin: "crux2"
            doubtful: "the console's threads: or System > PlayStation 5?"
          - id: "EmuCore/Speedhacks.fastCDVD"
            label: "Fast disc access"
            desc: "Fast disc access, shorter loading times. Check HDLoader compatibility lists for games that are known to have issues with this."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Enable Fast CDVD"
            pcsx2_description: "Fast disc access, shorter loading times. Check HDLoader compatibility lists for games that are known to have issues with this."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2709"
          - id: "EmuCore.CdvdPrecache"
            label: "Load the whole disc into memory"
            desc: "Loads the disc image into RAM before starting the virtual machine."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Enable CDVD Precaching"
            pcsx2_description: "Loads the disc image into RAM before starting the virtual machine."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2713"
            pcsx2_tooltip: "Loads the disc image into RAM before starting the virtual machine. Can reduce stutter on systems with hard drives that have long wake times, but significantly increases boot times."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:129"
          - id: "EmuCore.EnableCheats@emulation"
            label: "Cheats"
            desc: "Enables loading cheats from pnach files."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Enable Cheats"
            pcsx2_description: "Enables loading cheats from pnach files."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2702"
            pcsx2_tooltip: "Automatically loads and applies cheats on game start."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:132"
          - id: "EmuCore.HostFs"
            label: "Host file system"
            desc: "Allows games and homebrew to access files and folders directly in the title folder."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "Everything"
            origin: "pcsx2"
            pcsx2_title: "Enable Host Filesystem"
            pcsx2_description: "Allows games and homebrew to access files / folders directly on the host computer."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2704"
      - heading: "frame-pacing-latency-control"
        label: "FRAME PACING / LATENCY CONTROL"
        rows:
          - id: "PS5.OutputRefresh"
            label: "Refresh rate"
            desc: "Sends 120 Hz to the TV if it supports it. Needed for frame generation to 120 fps and black frame insertion. Hold L1 and R1 while Crux2 starts to use 60 Hz once."
            choices: ["120 Hz when the television has it", "60 Hz"]
            kind: "intlist"
            area: "Picture"
            section: "Output and HDR"
            level: "Essentials"
            origin: "crux2"
          - id: "PS5.VariableRefresh"
            label: "Variable refresh (VRR)"
            desc: "With 120 Hz on a TV that has VRR, each frame is shown as soon as it is ready instead of at the next fixed refresh: smoother when a game drops below full speed. Takes effect the next time Crux2 starts. Experimental."
            kind: "toggle"
            area: "Picture"
            section: "Output and HDR"
            level: "Essentials"
            origin: "crux2"
          - id: "EmuCore/GS.UseVSyncForTiming"
            label: "Frame pacing"
            desc: "By the screen: frames are paced by the display's refresh, the smoothest option. By the clock: for games whose frame rate the display can't match."
            choices: ["By the screen (smoothest)", "By the clock, in step with the screen", "By the clock, at the game's own rate"]
            kind: "combo"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Use Host VSync Timing"
            pcsx2_description: "Disables PCSX2's internal frame timing, and uses host vsync instead."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2768"
            pcsx2_tooltip: "When synchronizing with the host refresh rate, this option disables PCSX2's internal frame timing and uses the host instead. Can result in smoother frame pacing, <strong>but at the cost of increased input latency</strong>."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:151"
            doubtful: "frame pacing: or Picture > Output and HDR?"
          - id: "EmuCore/GS.VsyncQueueSize"
            label: "Frames queued for the display"
            desc: "Sets the number of frames which can be queued."
            choices: ["None (hard sync)", "1 frame", "2 frames", "3 frames"]
            kind: "intlist"
            area: "Emulation"
            section: "Emulation"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Maximum Frame Latency"
            pcsx2_description: "Sets the number of frames which can be queued."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2744"
            pcsx2_tooltip: "Sets the maximum number of frames that can be queued up to the GS, before the CPU thread will wait for one of them to complete before continuing. Higher values can assist with smoothing out irregular frame times, but increase input lag."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:140"
            doubtful: "frame pacing: or Picture > Output and HDR?"
          - id: "EmuCore/GS.PS5AutoFrameQueue"
            label: "Queue frames while the game is behind"
            desc: "When a game runs below full speed, lets up to 2 frames wait in the queue so the emulator and the graphics thread can work at the same time. Can add a little input lag while the game is slow."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "More"
            origin: "crux2"
            doubtful: "frame pacing: or Picture > Output and HDR?"
          - id: "EmuCore/GS.AdvancedFrameDisplay"
            label: "Show a frame as it begins"
            desc: "Displays the newest frame immediately at the beginning of the frame raster time, instead of at the end. Can reduce perceived input lag, but may cause problems with some games, such as Soulcalibur II and Baldur's Gate Dark Alliance II."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Advanced Frame Display"
            pcsx2_description_withheld: "PCSX2's text names games (rule 4): read it at its source"
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:2755"
            pcsx2_tooltip_withheld: "PCSX2's text names games (rule 4): read it at its source"
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:159"
            doubtful: "frame pacing: or Picture > Output and HDR?"
          - id: "EmuCore/GS.SkipDuplicateFrames"
            label: "Skip repeated frames"
            desc: "Skips displaying frames that don't change in 25/30fps games. Can improve speed, but increase input lag/make frame pacing worse."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Skip Presenting Duplicate Frames"
            pcsx2_description: "Skips displaying frames that don't change in 25/30fps games. Can improve speed, but increase input lag/make frame pacing worse."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3574"
            pcsx2_tooltip: "Detects when idle frames are being presented in 25/30fps games, and skips presenting those frames. The frame is still rendered, it just means the GPU has more time to complete it (this is NOT frame skipping). Can smooth out frame time fluctuations when the CPU/GPU are near maximum utilization, but makes frame pacing more inconsistent and can increase input lag. Helps when using frame generation on 25/30fps games."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/EmulationSettingsWidget.cpp:154"
            doubtful: "frame pacing: or Picture > Output and HDR?"
          - id: "EmuCore/GS.BlackFrameInsertion"
            label: "Black frame insertion"
            desc: "At 120 Hz, inserts a black frame after each frame to reduce motion blur. Makes the picture darker. Can't be used together with frame generation."
            kind: "toggle"
            area: "Picture"
            section: "Output and HDR"
            level: "More"
            origin: "crux2"
            doubtful: "with the frame pacing today; or Emulation > Emulation"
      - heading: "accurate-floating-point"
        label: "ACCURATE FLOATING POINT"
        rows:
          - id: "EmuCore/CPU.FPU.SoftFloat@emulation"
            label: "Accurate floating point (FPU)"
            desc: "Does the FPU's maths exactly as the PS2 does, for games whose physics or AI go wrong otherwise. Slower. From PCSX2 Reliquary. On by default for the games known to need it."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "crux2"
            layers: "game"
          - id: "EmuCore/CPU.VU0.SoftFloat@emulation"
            label: "Accurate floating point (VU0)"
            desc: "Does VU0's maths exactly as the PS2 does. Usually needed with the FPU one. Slower. From PCSX2 Reliquary. On by default for the games known to need it."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "crux2"
            layers: "game"
          - id: "EmuCore/CPU.VU1.SoftFloat@emulation"
            label: "Accurate floating point (VU1)"
            desc: "Does VU1's maths exactly as the PS2 does, for some graphics errors. Much slower: use it only when a game needs it. From PCSX2 Reliquary."
            kind: "toggle"
            area: "Emulation"
            section: "Emulation"
            level: "Essentials"
            origin: "crux2"
            layers: "game"
