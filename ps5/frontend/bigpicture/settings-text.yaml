          - id: "PS5.ColourFilter"
            label: "Colour filter on the game"
            desc: "For colour blindness: moves the colours you may not tell apart to ones you can. Red-weak and green-weak help with reds and greens, blue-weak with blues and yellows. The game's picture only; the menus' colours are under Interface."
            choices: ["Off", "Red-weak", "Green-weak", "Blue-weak", "Greyscale"]
            kind: "intlist"
            area: "Picture"
            section: "Looks"
            level: "Essentials"
            origin: "crux2"
            doubtful: "for colour blindness: or Interface > Interface (with the menus' colours)?"
          - id: "EmuCore/GS.ShadeBoost"
            label: "Shade boost"
            desc: "Enables brightness/contrast/gamma/saturation adjustment."
            kind: "toggle"
            area: "Picture"
            section: "Looks"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Shade Boost"
            pcsx2_description: "Enables brightness/contrast/gamma/saturation adjustment."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3429"
            pcsx2_tooltip: "Enables saturation, contrast, and brightness to be adjusted. Values of brightness, saturation, and contrast are at default 50."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:723"
          - id: "EmuCore/GS.ShadeBoost_Brightness"
            label: "Brightness"
            desc: "Adjusts brightness. 50 is normal."
            kind: "intrange"
            area: "Picture"
            section: "Looks"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Brightness"
            pcsx2_description: "Adjusts brightness. 50 is normal."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3431"
          - id: "EmuCore/GS.ShadeBoost_Contrast"
            label: "Contrast"
            desc: "Adjusts contrast. 50 is normal."
            kind: "intrange"
            area: "Picture"
            section: "Looks"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Contrast"
            pcsx2_description: "Adjusts contrast. 50 is normal."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3433"
          - id: "EmuCore/GS.ShadeBoost_Gamma"
            label: "Gamma"
            desc: "Adjusts gamma. 50 is normal."
            kind: "intrange"
            area: "Picture"
            section: "Looks"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Gamma"
            pcsx2_description: "Adjusts gamma. 50 is normal."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3435"
          - id: "EmuCore/GS.ShadeBoost_Saturation"
            label: "Saturation"
            desc: "Adjusts saturation. 50 is normal."
            kind: "intrange"
            area: "Picture"
            section: "Looks"
            level: "Essentials"
            origin: "pcsx2"
            pcsx2_title: "Saturation"
            pcsx2_description: "Adjusts saturation. 50 is normal."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3437"
          - id: "EmuCore/GS.FrameGeneration"
            label: "Frame generation"
            desc: "Generates extra frames between the game's own, so a 30 fps game is shown at 60 fps. Adds a little input lag and can cause smearing on fast movement."
            choices: ["Off", "30 to 60", "30 to 60, and 60 to 120 at 120 Hz"]
            kind: "intlist"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
          - id: "EmuCore/GS.FrameGenerationMethod"
            label: "Frame generation method"
            desc: "How the extra frames are made. Crux2's own: its motion search. AMD FSR 3 optical flow: handles small, fast movement better, and keeps a score or a map still. MihawkGen: Mihawk's small trained network, which looks at the two pictures only and leaves what did not move exactly as it was."
            choices: ["Crux2's own", "AMD FSR 3 optical flow", "MihawkGen"]
            kind: "intlist"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
          - id: "EmuCore/GS.FrameGenerationQuality"
            label: "Optical flow quality"
            desc: "Higher quality needs more GPU power."
            choices: ["Performance", "Balanced", "Quality"]
            kind: "intlist"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
          - id: "EmuCore/GS.FrameGenerationSkipVideos"
            label: "No frame generation during videos"
            desc: "Turns frame generation off while the game plays a video."
            kind: "toggle"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
          - id: "EmuCore/GS.FrameGenerationSteady30"
            label: "Steady 30"
            desc: "Takes the game's pictures two vsyncs apart at the most, so a game that goes between 30 and 60 a second is shown at an even 30 that frame generation makes 60 (120 at 120 Hz). For games that cannot hold 60."
            kind: "toggle"
            area: "Picture"
            section: "Frame generation"
            level: "Essentials"
            origin: "crux2"
          - id: "EmuCore/GS.PS5FrameGenDebug"
            label: "Show the movement"
            desc: "For checking frame generation, not for playing: the made frames show what AMD FSR 3 optical flow decided for each pixel instead of the picture (red both frames, green the newer alone, blue the older alone, grey the two mixed). Takes effect the next time a game starts."
            kind: "toggle"
            area: "Picture"
            section: "Frame generation"
            level: "More"
            origin: "crux2"
      - heading: "advanced"
        label: "ADVANCED"
        rows:
          - id: "EmuCore/GS.PS5HoldFeedbackLayout"
            label: "Keep read render targets uncompressed (experimental)"
            desc: "Keeps render targets uncompressed when glow and flare effects read them. Can be faster in some games. Experimental; takes effect the next time a game starts."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.PS5RTNoCompression"
            label: "Render targets without compression (experimental)"
            desc: "Creates render targets without colour compression. Can be faster or slower depending on the game. Experimental; takes effect the next time a game starts."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.PS5SkipRedundantBarriers"
            label: "Leave out barriers with nothing to wait for"
            desc: "Skips GPU waits when nothing has been drawn since the last one. Turn off if effects look wrong. Takes effect the next time a game starts."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.PS5ReuseRTCopies"
            label: "Reuse copies of the picture"
            desc: "Reuses copies of the screen for glow and blur effects when nothing has changed. Turn off if an effect looks a frame behind. Takes effect the next time a game starts."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.PS5ROVKeepPass"
            label: "Keep the ordered view's render passes"
            desc: "Keeps draws that use the rasterizer ordered view in the same render pass. Much less CPU work in scenes with many lights. Takes effect the next time a game starts."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
          - id: "EmuCore/GS.HWDownloadMode"
            label: "Hardware download mode"
            desc: "Changes synchronization behavior for GS downloads."
            choices: ["Accurate", "Accurate, always whole (fewer readbacks)", "No readbacks (the threads run in step)", "Unsynchronised (not the same twice)", "Off (the game reads nothing back)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Hardware Download Mode"
            pcsx2_description: "Changes synchronization behavior for GS downloads."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3592"
            pcsx2_tooltip: "Skips synchronizing with the GS thread and host GPU for GS downloads. Can result in a large speed boost on slower systems, at the cost of many broken graphical effects. If games are broken and you have this option enabled, please disable it first."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:841"
          - id: "EmuCore/GS.texture_preloading"
            label: "Texture preloading"
            desc: "Uploads full textures to the GPU on use, rather than only the utilized regions. Can improve performance in some games."
            choices: ["Off", "Partial", "Full (hash cache)"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Texture Preloading"
            pcsx2_description: "Uploads full textures to the GPU on use, rather than only the utilized regions. Can improve performance in some games."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3622"
            pcsx2_tooltip: "Uploads entire textures at once instead of in small pieces, avoiding redundant uploads when possible. Improves performance in most games, but can make a small selection slower."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:542"
          - id: "EmuCore/GS.ExtendedUpscalingMultipliers"
            label: "Extended upscaling multipliers"
            desc: "Displays additional, very high upscaling multipliers dependent on GPU and driver capability."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Extended Upscaling Multipliers"
            pcsx2_description: "Displays additional, very high upscaling multipliers dependent on GPU and driver capability."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3587"
          - id: "EmuCore/GS.upscale_multiplier@graphics/advanced"
            label: "Internal resolution above 12x"
            desc: "Multiplies the render resolution by the specified factor (upscaling)."
            choices: ["13x", "14x", "15x", "16x", "17x", "18x", "19x", "20x", "21x", "22x", "23x", "24x", "25x"]
            kind: "floatlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Internal Resolution"
            pcsx2_description: "Multiplies the render resolution by the specified factor (upscaling)."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3163"
          - id: "EmuCore/GS.OverrideTextureBarriers"
            label: "Override texture barriers"
            desc: "Forces texture barrier functionality to the specified value."
            choices: ["Automatic", "Off", "On"]
            kind: "intlist"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Override Texture Barriers"
            pcsx2_description: "Forces texture barrier functionality to the specified value."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3600"
          - id: "EmuCore/GS.HWROVBarriersVK"
            label: "Extra barriers with the ordered view"
            desc: "Forces extra barriers when using ROV with Vulkan to fix graphical issues present in some games and hardware configurations."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "ROV Barriers Vulkan"
            pcsx2_description: "Forces extra barriers when using ROV with Vulkan to fix graphical issues present in some games and hardware configurations."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3611"
          - id: "EmuCore/GS.DisableShaderCache"
            label: "Disable shader cache"
            desc: "Prevents the loading and saving of shaders/pipelines to disk."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Disable Shader Cache"
            pcsx2_description: "Prevents the loading and saving of shaders/pipelines to disk."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3607"
          - id: "EmuCore/GS.DisableVertexShaderExpand"
            label: "Disable vertex shader expand"
            desc: "Falls back to the CPU for expanding sprites/lines."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Disable Vertex Shader Expand"
            pcsx2_description: "Falls back to the CPU for expanding sprites/lines."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3609"
          - id: "EmuCore/GS.HWSpinCPUForReadbacks"
            label: "Spin CPU during readbacks"
            desc: "Does useless work on the CPU during readbacks to prevent it from going into powersave modes. May improve performance during readbacks but with a significant increase in power usage."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Spin CPU During Readbacks"
            pcsx2_description: "Does useless work on the CPU during readbacks to prevent it from going into powersave modes. May improve performance during readbacks but with a significant increase in power usage."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3614"
            pcsx2_tooltip: "Does useless work on the CPU during readbacks to prevent it from going to into powersave modes. May improve performance during readbacks but with a significant increase in power usage."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/GraphicsSettingsWidget.cpp:559"
          - id: "EmuCore/GS.HWSpinGPUForReadbacks"
            label: "Spin GPU during readbacks"
            desc: "Submits useless work to the GPU during readbacks to prevent it from going into powersave modes. May improve performance during readbacks but with a significant increase in power usage."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Spin GPU During Readbacks"
            pcsx2_description: "Submits useless work to the GPU during readbacks to prevent it from going into powersave modes. May improve performance during readbacks but with a significant increase in power usage."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3618"
          - id: "EmuCore/GS.DisableFramebufferFetch"
            label: "Disable framebuffer fetch"
            desc: "Prevents the usage of framebuffer fetch when supported by host GPU."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Disable Framebuffer Fetch"
            pcsx2_description: "Prevents the usage of framebuffer fetch when supported by host GPU."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3605"
          - id: "EmuCore/GS.UseBlitSwapChain"
            label: "Use blit swap chain"
            desc: "Uses a blit presentation model instead of flipping when using the Direct3D 11 graphics API. Has no effect on the PS5."
            kind: "toggle"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
            pcsx2_title: "Use Blit Swap Chain"
            pcsx2_description: "Uses a blit presentation model instead of flipping when using the Direct3D 11 graphics API. This usually results in slower performance, but may be required for some streaming applications, or to uncap framerates on some systems."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:3582"
          - id: "EmuCore/GS.FramerateNTSC"
            label: "NTSC frame rate"
            desc: "The frame rate used for NTSC games."
            kind: "floatrange"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
          - id: "EmuCore/GS.FrameratePAL"
            label: "PAL frame rate"
            desc: "The frame rate used for PAL games."
            kind: "floatrange"
            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "pcsx2"
