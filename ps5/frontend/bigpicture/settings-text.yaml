  - page: "advanced"
    name: "Advanced"
    headings:
      - heading: "emotionengine-mips-iv"
        label: "EMOTIONENGINE (MIPS-IV)"
        rows:
          - id: "EmuCore/CPU.FPU.Roundmode"
            label: "Rounding mode"
            desc: "Determines how the results of floating-point operations are rounded. Some games need specific settings."
            choices: ["Nearest", "Negative", "Positive", "Chop / zero"]
            kind: "intlist"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Rounding Mode"
            pcsx2_description: "Determines how the results of floating-point operations are rounded. Some games need specific settings."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5794"
            pcsx2_tooltip: "Changes how PCSX2 handles rounding while emulating the Emotion Engine's Floating Point Unit (EE FPU). Because the various FPUs in the PS2 are non-compliant with international standards, some games may need different modes to do math correctly. The default value handles the vast majority of games; <b>modifying this setting when a game is not having a visible problem can cause instability.</b>"
            pcsx2_tooltip_source: "pcsx2-qt/Settings/AdvancedSettingsWidget.cpp:69"
          - id: "EmuCore/CPU.FPUDiv.Roundmode"
            label: "Division rounding mode"
            desc: "Determines how the results of floating-point division is rounded. Some games need specific settings."
            choices: ["Nearest", "Negative", "Positive", "Chop / zero"]
            kind: "intlist"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Division Rounding Mode"
            pcsx2_description: "Determines how the results of floating-point division is rounded. Some games need specific settings."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5798"
            pcsx2_tooltip: "Determines how the results of floating-point division are rounded. Some games need specific settings; <b>modifying this setting when a game is not having a visible problem can cause instability.</b>"
            pcsx2_tooltip_source: "pcsx2-qt/Settings/AdvancedSettingsWidget.cpp:71"
          - id: "EmuCore/CPU/Recompiler.fpuOverflow"
            label: "Clamping mode"
            desc: "How numbers out of range are handled. Normal suits most games"
            choices: ["None", "Normal", "Extra, keep the sign", "Full"]
            kind: "combo"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Clamping Mode"
            pcsx2_description: "Determines how out-of-range floating point numbers are handled. Some games need specific settings."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5802"
          - id: "EmuCore/CPU/Recompiler.EnableEE"
            label: "Enable recompiler"
            desc: "Performs just-in-time binary translation of 64-bit MIPS-IV machine code to native code."
            kind: "toggle"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Enable Recompiler"
            pcsx2_description: "Performs just-in-time binary translation of 64-bit MIPS-IV machine code to native code."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5805"
          - id: "EmuCore/CPU/Recompiler.EnableEECache"
            label: "Enable cache (slow)"
            desc: "Enables emulation of the EE's hardware cache. Interpreter only, provided for diagnostics."
            kind: "toggle"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Enable Cache (Slow)"
            pcsx2_description: "Enables emulation of the EE's hardware cache. Interpreter only, provided for diagnostics."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5808"
          - id: "EmuCore/Speedhacks.IntcStat"
            label: "INTC spin detection"
            desc: "Huge speedup for some games, with almost no compatibility side effects."
            kind: "toggle"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "INTC Spin Detection"
            pcsx2_description: "Huge speedup for some games, with almost no compatibility side effects."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5811"
          - id: "EmuCore/Speedhacks.WaitLoop"
            label: "Wait loop detection"
            desc: "Moderate speedup for some games, with no known side effects."
            kind: "toggle"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Wait Loop Detection"
            pcsx2_description: "Moderate speedup for some games, with no known side effects."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5813"
          - id: "EmuCore/CPU/Recompiler.EnableFastmem"
            label: "Enable fast memory access"
            desc: "Uses backpatching to avoid register flushing on every memory access."
            kind: "toggle"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Enable Fast Memory Access"
            pcsx2_description: "Uses backpatching to avoid register flushing on every memory access."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5815"
          - id: "EmuCore/CPU/Recompiler.PauseOnTLBMiss"
            label: "Pause on TLB miss"
            desc: "Pauses the virtual machine when a TLB miss occurs, instead of ignoring it and continuing."
            kind: "toggle"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Pause On TLB Miss"
            pcsx2_description: "Pauses the virtual machine when a TLB miss occurs, instead of ignoring it and continuing."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5818"
            pcsx2_tooltip: "Pauses the virtual machine when a TLB miss occurs, instead of ignoring it and continuing. Note that the VM will pause after the end of the block, not on the instruction which caused the exception. Refer to the console to see the address where the invalid access occurred."
            pcsx2_tooltip_source: "pcsx2-qt/Settings/AdvancedSettingsWidget.cpp:95"
          - id: "EmuCore/CPU.ExtraMemory"
            label: "Enable 128MB RAM (dev console)"
            desc: "Exposes additional memory to the virtual machine, expanding the EE and IOP memory to 128MB and 8MB respectively."
            kind: "toggle"
            area: "Emulation"
            section: "Advanced (EE, VU, IOP)"
            level: "Everything"
            origin: "pcsx2"
            layers: "shared"
            pcsx2_title: "Enable Extended RAM (Dev Console)"
            pcsx2_description: "Exposes additional memory to the virtual machine, expanding the EE and IOP memory to 128MB and 8MB respectively."
            pcsx2_source: "pcsx2/ImGui/FullscreenUI_Settings.cpp:5821"
      - heading: "vector-units-vu"
        label: "VECTOR UNITS (VU)"
        rows:
          - id: "EmuCore/CPU.VU0.Roundmode"
            label: "VU0 rounding mode"
            desc: "Determines how the results of floating-point operations are rounded. Some games need specific settings."
            choices: ["Nearest", "Negative", "Positive", "Chop / zero"]
            kind: "intlist"
