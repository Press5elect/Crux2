            area: "Picture"
            section: "Graphics"
            level: "More"
            origin: "crux2"
            label_text: "written"
            text: "written"
          - id: "EmuCore/GS.PS5SharedTargetMemory"
            label: "Shared Render Target Memory"
            desc: "Allocates render targets from shared memory blocks instead of one allocation each. Reduces the time spent creating textures at high internal resolutions."
