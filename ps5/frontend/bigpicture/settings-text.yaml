            text: "written"
            new_choices: ["Linear (Default)", "Gentle", "Gentler", "Gentlest"]
            choices_text: "written"
          - id: "PS5.StickCurveRight"
            label: "Right stick response"
            desc: "Linear: as the stick is pushed. Gentle to Gentlest: a small push moves less, for finer control near the centre; a full push still goes all the way."
            choices: ["Linear", "Gentle", "Gentler", "Gentlest"]
