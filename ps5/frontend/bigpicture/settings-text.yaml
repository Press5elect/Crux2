            area: "System"
            section: "Log"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "PS5.LogMode"
            label: "Boot log"
            desc: "Only when something goes wrong: the session's log is kept in memory and written to crux2-boot.log after a crash, a game that did not start, 15 seconds without a new picture while a game runs, or Save the log. Always written: every line goes to the file as it is logged, as before. Takes effect the next time Crux2 starts."
            choices: ["Only when something goes wrong", "Always written"]
            kind: "stringlist"
            area: "System"
            section: "Log"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
          - id: "action:the-run-before"
