            new_desc: "Uses how far R2 is pulled as the pressure of the face buttons and D-pad, for games with pressure-sensitive buttons."
            text: "written"
          - id: "PS5.StickCurveLeft"
            label: "Left stick response"
            desc: "Linear: as the stick is pushed. Gentle to Gentlest: a small push moves less, for finer control near the centre; a full push still goes all the way."
            choices: ["Linear", "Gentle", "Gentler", "Gentlest"]
            kind: "stringlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            new_label: "Left Stick Response"
            label_text: "written"
