      - heading: "the-console-s-controllers"
        label: "THE CONSOLE'S CONTROLLERS"
        rows:
          - id: "PS5.LeaveGameCombo"
            label: "Close Game Combination"
            desc: "Selects the buttons that close the game when held."
            choices: ["L3 + R3 (Default)", "L1 + R1 + L3 + R3", "Disabled"]
            kind: "stringlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.LeaveGameHoldSeconds"
            label: "Close Game Hold Time"
            desc: "Determines how long the buttons must be held to close the game."
            choices: ["1 Second", "2 Seconds (Default)", "3 Seconds"]
            kind: "floatlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.PressureFromR2"
            label: "Pressure from R2"
            desc: "Uses how far R2 is pulled as the pressure of the face buttons and D-pad, for games with pressure-sensitive buttons."
            kind: "toggle"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.StickCurveLeft"
            label: "Left Stick Response"
            desc: "Determines how the stick responds. Linear follows the stick as pushed; Gentle to Gentlest move less for a small push, for finer control near the center, while a full push still reaches the maximum."
            choices: ["Linear (Default)", "Gentle", "Gentler", "Gentlest"]
            kind: "stringlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.StickCurveRight"
            label: "Right Stick Response"
            desc: "Determines how the stick responds. Linear follows the stick as pushed; Gentle to Gentlest move less for a small push, for finer control near the center, while a full push still reaches the maximum."
            choices: ["Linear (Default)", "Gentle", "Gentler", "Gentlest"]
            kind: "stringlist"
            area: "Controls"
            section: "Controllers"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.MotionAim"
            label: "Motion Aiming"
            desc: "Aims the GunCon 2 light gun by moving the controller while a GunCon 2 is connected. Hold R3 briefly to recenter; hold it for two seconds to calibrate the screen."
            kind: "toggle"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.MotionAimMode"
            label: "Aiming Mode"
            desc: "Selects how motion aiming follows the controller. Absolute aims where the controller points, without drift. Relative adds up the controller's turns like a mouse and stops at the edges."
            choices: ["Absolute (Default)", "Relative"]
            kind: "stringlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.MotionAimSpeed"
            label: "Aiming Range"
            desc: "Determines how far the controller must turn to aim at the edge of the screen with absolute aiming. Calibrated uses the screen as measured by pointing at its corners."
            choices: ["Calibrated", "1 (Slowest)", "2", "3", "4", "5 (Default)", "6", "7", "8", "9", "10 (Fastest)"]
            kind: "intlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "action:measure-the-screen"
            label: "Calibrate Screen"
            desc: "Calibrates the screen for motion aiming: back in the game, point at the top-left corner and press R3, then at the bottom-right corner and press R3. Holding R3 for two seconds during a game does the same."
            kind: "action"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.MotionAimSmoothing"
            label: "Aiming Smoothing"
            desc: "Steadies a still hand without slowing a quick sweep, with absolute aiming."
            choices: ["Off", "Light (Default)", "Medium", "Strong"]
            kind: "intlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.MotionAimGrip"
            label: "Controller Grip"
            desc: "Selects how the controller is held for absolute aiming: in both hands, or upright in one hand with the index finger on R2 like a pistol. Automatic detects it from how the controller is held when the aim is recentered."
            choices: ["Automatic (Default)", "Both Hands", "Upright in One Hand"]
            kind: "stringlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.GunConTriggerFeel"
            label: "Light Gun Trigger Feel"
            desc: "Makes R2 resist and then give way like a trigger while a GunCon 2 is connected, firing the shot with the click."
            choices: ["Off", "Light", "Firm (Default)"]
            kind: "stringlist"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
            choices_text: "written"
          - id: "PS5.MotionAimSensitivity"
            label: "Relative Aiming Range"
            desc: "Determines how far the controller must turn to aim at the edge of the screen with relative aiming."
            kind: "intrange"
            area: "Controls"
            section: "Light gun"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.MoveAim"
            label: "PlayStation Move Aiming"
            desc: "Aims player 1's GunCon 2 with a PlayStation Move, with a Navigation controller as its D-pad. Requires the Move Management payload. Press Select on the Move to recenter."
            kind: "toggle"
            area: "Controls"
            section: "PS Move"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.USBKeyboard"
            label: "USB Keyboard"
            desc: "Allows a USB keyboard to type in the menus and to act as a PS2 keyboard in games that support one."
            kind: "toggle"
            area: "Controls"
            section: "USB devices"
            level: "Essentials"
            origin: "crux2"
            layers: "shared"
            label_text: "written"
            text: "written"
          - id: "PS5.USBPads"
            label: "USB Controllers"
            desc: "Allows controllers connected to the console's USB ports to be used, such as a DualShock 3, Xbox 360 controllers, guitars and drums. May not work with every controller."
